<style>
  /* Layout: one centered column — header, two pickers, then one or more chart cards */
  :root {
    --font-anthropic-sans: "Sarabun", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
    --font-anthropic-serif: "Noto Serif Thai", "Sarabun", Georgia, serif;
    --cds-font-size-title: 1.75rem;
    --cds-font-size-heading: 1.125rem;
    --cds-font-size-body: 0.95rem;
    --cds-font-size-caption: 0.8rem;
    --cds-font-weight-medium: 600;
    --cds-gap-xs: 0.25rem; --cds-gap-sm: 0.5rem; --cds-gap-md: 1rem; --cds-gap-lg: 1.5rem;
    --cds-pad-xs: 0.25rem; --cds-pad-sm: 0.5rem; --cds-pad-md: 0.75rem; --cds-pad-lg: 1.25rem;
    --cds-radius: 10px;
    --cds-dur-slow: 300ms;
    --accent: #2f6f8f;
    --color-bg: #f4f6f7;
    --color-panel: #ffffff;
    --color-fg: #1d2a30;
    --color-fg-muted: #5b6b73;
    --color-border-line: #dde3e6;
    --color-bad: #b42318;
    --color-warn: #a15c07;
    --cds-chart-grid: #e7ecee;
    --cds-chart-axis: #8a9aa2;
    --cds-chart-reference: #3d4b52;
    --cds-surface-popover: #ffffff;
    --cds-border: #d3dadd;
    --cds-shadow-popover: 0 4px 16px rgba(20, 35, 45, 0.12);
    --cds-text-secondary: #5b6b73;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent: #6fb3d2; --color-bg: #12181b; --color-panel: #1a2226; --color-fg: #e6edf0; --color-fg-muted: #9aaab2;
      --color-border-line: #2c373c; --color-bad: #f0796e; --color-warn: #e0a34a; --cds-chart-grid: #263035; --cds-chart-axis: #6c7d85;
      --cds-chart-reference: #c4d0d5; --cds-surface-popover: #222c31; --cds-border: #34424a; --cds-shadow-popover: 0 4px 16px rgba(0, 0, 0, 0.4);
      --cds-text-secondary: #9aaab2; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --accent: #6fb3d2; --color-bg: #12181b; --color-panel: #1a2226; --color-fg: #e6edf0; --color-fg-muted: #9aaab2;
    --color-border-line: #2c373c; --color-bad: #f0796e; --color-warn: #e0a34a; --cds-chart-grid: #263035; --cds-chart-axis: #6c7d85;
    --cds-chart-reference: #c4d0d5; --cds-surface-popover: #222c31; --cds-border: #34424a; --cds-shadow-popover: 0 4px 16px rgba(0, 0, 0, 0.4);
    --cds-text-secondary: #9aaab2; color-scheme: dark;
  }
  body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); }
  .ky-page { padding-inline: 16px; padding-block: 24px 40px; }
  .ky-updated { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  // Stand-in for the dashboard runtime: data is embedded in the page, so no sign-in is needed.
  window.dash = (() => {
    let fn = null;
    let params = {};
    const run = () => { if (fn) fn(); };
    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(run, 150); });
    return {
      colors: ['var(--accent)'],
      data: () => {
        const el = document.getElementById('hdc-data');
        return { status: 'ok', data: el ? JSON.parse(el.textContent) : [] };
      },
      params: () => params,
      setParams: (p) => { params = { ...params, ...p }; run(); },
      onData: (f) => { fn = f; if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run(); },
    };
  })();
</script>

<style>
  /* Layout: admin-style — dark sidebar menu (groups > indicators) | main: title bar, breadcrumb, per chart: 4 tiles, bar chart + gauge */
  .ky {
    --ky-font: "Sarabun", "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
    --ky-accent: var(--color-fg);
    --ky-side-bg: #263241; --ky-side-fg: #c8d2dc; --ky-side-muted: #8796a6; --ky-side-hover: #2f3d4f; --ky-side-active: #3a78b5;
    --ky-t1: #3e6cad; --ky-t2: #2f8f7c; --ky-t3: #3b8fb8; --ky-t4: #66599f;
    font-family: var(--ky-font);
    display: grid; grid-template-columns: 16.5rem minmax(0, 1fr);
    border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); overflow: hidden;
    background: var(--color-panel); min-height: 40rem;
  }
  /* sidebar */
  .ky-side { background: var(--ky-side-bg); color: var(--ky-side-fg); display: flex; flex-direction: column; min-width: 0; }
  .ky-brand { display: flex; align-items: center; gap: 0.7rem; padding: 1.1rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
  .ky-logo { width: 2.9rem; height: 2.9rem; flex: none; background: #fff; border-radius: 50%; padding: 2px; }
  .ky-brand b { display: block; color: #fff; font-weight: 600; font-size: 1rem; line-height: 1.3; }
  .ky-brand span { display: block; font-size: var(--cds-font-size-caption); color: var(--ky-side-muted); }
  .ky-menu-toggle { display: none; }
  .ky-menu { padding: 0.6rem 0; flex: 1; }
  .ky-menu-label { padding: 0.5rem 1.1rem 0.3rem; font-size: 0.72rem; letter-spacing: 0.06em; color: var(--ky-side-muted); }
  .ky-grp { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 0.75rem; width: 100%; padding: 0.7rem 1.1rem; cursor: pointer; color: var(--ky-side-fg); font-size: var(--cds-font-size-body); line-height: 1.35; }
  .ky-grp:hover { background: var(--ky-side-hover); color: #fff; }
  .ky-grp.ky-active { background: var(--ky-side-active); color: #fff; font-weight: 600; }
  .ky-grp:focus-visible, .ky-sub:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  .ky-grp svg { width: 1.2rem; height: 1.2rem; flex: none; }
  .ky-grp .ky-chev { margin-left: auto; width: 0.9rem; height: 0.9rem; transition: transform var(--cds-dur-slow); }
  .ky-grp[aria-expanded="true"] .ky-chev { transform: rotate(90deg); }
  .ky-subs { background: rgba(0, 0, 0, 0.14); padding: 0.3rem 0; }
  .ky-sub { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 0.5rem 1.1rem 0.5rem 3.05rem; cursor: pointer; font-size: 0.86rem; line-height: 1.4; color: var(--ky-side-fg); position: relative; }
  .ky-sub:hover { color: #fff; background: var(--ky-side-hover); }
  .ky-sub[aria-current="true"] { color: #fff; font-weight: 600; }
  .ky-sub[aria-current="true"]::before { content: ""; position: absolute; left: 2.05rem; top: 50%; width: 0.4rem; height: 0.4rem; border-radius: 50%; background: #fff; transform: translateY(-50%); }
  .ky-side-foot { padding: 0.9rem 1.1rem; font-size: 0.75rem; color: var(--ky-side-muted); border-top: 1px solid rgba(255, 255, 255, 0.08); }
  /* main */
  .ky-main { min-width: 0; display: flex; flex-direction: column; background: var(--color-bg, var(--color-panel)); }
  .ky-top { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.5rem; background: var(--color-panel); border-bottom: 1px solid var(--color-border-line); }
  .ky-top h1 { margin: 0; font-family: var(--ky-font); font-size: 1.3rem; font-weight: 600; line-height: 1.35; text-wrap: balance; }
  .ky-crumb { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; justify-content: space-between; padding: 0.6rem 1.5rem; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); background: var(--color-panel); border-bottom: 1px solid var(--color-border-line); }
  .ky-body { padding: 1.25rem 1.5rem 2rem; display: grid; gap: 2rem; }
  .ky-sec { display: grid; gap: 1rem; min-width: 0; }
  .ky-sec h2 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: 600; line-height: 1.4; text-wrap: balance; }
  .ky-note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-top: 0.2rem; }
  .ky-ov-grid { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); }
  .ky-ov { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 0.45rem; background: var(--color-panel); border: 1px solid var(--color-border-line); border-left: 4px solid var(--ky-ov-c, var(--color-border-line)); border-radius: var(--cds-radius); padding: 0.85rem 1rem; cursor: pointer; min-width: 0; }
  .ky-ov:hover { border-color: var(--ky-accent); border-left-color: var(--ky-ov-c, var(--ky-accent)); box-shadow: var(--cds-shadow-popover); }
  .ky-ov:focus-visible { outline: 2px solid var(--ky-accent); outline-offset: 2px; }
  .ky-ov .nm { font-size: 0.86rem; line-height: 1.4; color: var(--color-fg); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.6em; }
  .ky-ov .vals { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
  .ky-ov .v { font-size: 1.55rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-fg); }
  .ky-ov .v small { font-size: 0.85rem; font-weight: 500; }
  .ky-ov .pv { font-size: 0.78rem; color: var(--color-fg-muted); text-align: right; }
  .ky-ov .bar { position: relative; height: 8px; border-radius: 4px; background: var(--cds-chart-grid); }
  .ky-ov .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
  .ky-ov .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--cds-chart-reference); }
  .ky-pill { align-self: flex-start; font-size: 0.74rem; font-weight: 600; padding: 0.1rem 0.55rem; border-radius: 999px; border: 1px solid currentColor; }
  .ky-pill.ok { color: var(--ky-t2); } .ky-pill.bad { color: var(--color-bad); } .ky-pill.none { color: var(--color-fg-muted); }
  .ky-old { display: inline-block; margin-left: var(--cds-gap-xs); padding: 0 var(--cds-pad-sm); border: 1px solid currentColor; border-radius: 999px; color: var(--color-warn); }
  /* tiles */
  .ky-tiles { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .ky-tile { position: relative; overflow: hidden; border-radius: var(--cds-radius); color: #fff; padding: 1rem 1.1rem 1.05rem; min-height: 7.4rem; display: flex; flex-direction: column; gap: 0.15rem; }
  .ky-tile .lbl { font-size: 0.86rem; opacity: 0.92; position: relative; }
  .ky-tile .big { font-size: 1.85rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; position: relative; overflow-wrap: anywhere; }
  .ky-tile .big small { font-size: 1rem; font-weight: 500; }
  .ky-tile .sub { font-size: 0.8rem; opacity: 0.92; margin-top: auto; position: relative; }
  .ky-tile svg { position: absolute; right: -0.4rem; bottom: -0.5rem; width: 5.4rem; height: 5.4rem; opacity: 0.18; }
  .ky-t1 { background: var(--ky-t1); } .ky-t2 { background: var(--ky-t2); } .ky-t3 { background: var(--ky-t3); } .ky-t4 { background: var(--ky-t4); }
  .ky-tile.ky-miss { box-shadow: inset 0 -4px 0 #f3b4ad; }
  /* chart + gauge */
  .ky-row { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr) 17rem; align-items: start; }
  .ky-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 1.1rem 1.2rem; min-width: 0; }
  .ky-card h3 { margin: 0 0 0.6rem; font-size: 1rem; font-weight: 600; }
  .ky-legend { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm) var(--cds-gap-lg); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-bottom: var(--cds-gap-md); }
  .ky-legend span { display: inline-flex; align-items: center; gap: var(--cds-gap-xs); }
  .ky-sw { width: 0.75rem; height: 0.75rem; border-radius: 3px; display: inline-block; }
  .ky-dash { width: 1.25rem; border-top: 2px dashed var(--cds-chart-reference); display: inline-block; }
  .ky-chart { position: relative; min-height: 480px; }
  .ky-chart text, .ky-gauge text { fill: var(--color-fg-muted); font-size: var(--cds-font-size-body); font-family: var(--ky-font); font-variant-numeric: tabular-nums; }
  .ky-chart .ky-strong, .ky-gauge .ky-strong { fill: var(--color-fg); font-weight: 600; }
  .ky-chart .ky-tick, .ky-gauge .ky-tick { font-size: var(--cds-font-size-caption); }
  .ky-chart .ky-below { fill: var(--color-bad); }
  .ky-gauge { position: relative; min-height: 150px; }
  .ky-gauge .ky-gval { font-size: 1.7rem; font-weight: 600; fill: var(--color-fg); }
  .ky-gauge-note { text-align: center; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-top: 0.3rem; }
  .ky-gauge-note b { font-weight: 600; }
  .ky-ok-text { color: var(--ky-t2); } .ky-bad-text { color: var(--color-bad); }
  .ky-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; z-index: 2; }
  .ky-tip .k { color: var(--cds-text-secondary); }
  [data-dash-source-state=empty] { color: transparent; }
  [data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
  @media (max-width: 1100px) { .ky-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ky-row { grid-template-columns: minmax(0, 1fr); } .ky-gauge-card { max-width: 24rem; } }
  @media (max-width: 860px) {
    .ky { grid-template-columns: minmax(0, 1fr); }
    .ky-brand { padding: 0.8rem 1rem; }
    .ky-menu-toggle { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 0.6rem; margin-left: auto; padding: 0.45rem 0.75rem; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 8px; color: #fff; font-size: 0.86rem; cursor: pointer; }
    .ky-menu-toggle:focus-visible { outline: 2px solid #fff; }
    .ky-side:not(.ky-open) .ky-menu, .ky-side:not(.ky-open) .ky-side-foot { display: none; }
    .ky-top, .ky-crumb { padding-inline: 1rem; }
    .ky-body { padding: 1rem 1rem 1.5rem; }
  }
  @media (max-width: 480px) { .ky-tiles { grid-template-columns: minmax(0, 1fr); } .ky-tile { min-height: 0; } }
</style>

<script>
  const f2 = (v) => Number(v).toFixed(2);
  const thDate = (s) => new Date(s + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
  const tint = (p) => `color-mix(in srgb, ${dash.colors[0]} ${p}%, var(--color-panel))`;
  const PAL = { pass: tint(80), sum: tint(38), bad: 'var(--color-bad)' };
  const SERIES_TINTS = [88, 64, 44, 28];
  const seriesColor = (i, n) => tint(n === 2 ? [85, 50][i] : SERIES_TINTS[i] ?? 30);
  const seriesOf = (row) => {
    const out = [];
    for (let i = 1; i <= 6; i++) {
      const label = row[`s${i}_label`];
      if (!label) break;
      out.push({ key: i === 1 ? 'pct' : `pct${i}`, A: i === 1 ? 'A' : `A${i}`, B: i === 1 ? 'B' : `B${i}`, label });
    }
    return out;
  };
  const menuEl = document.getElementById('ky-menu');
  const sideEl = document.getElementById('ky-side');
  const toggleEl = document.getElementById('ky-toggle');
  const cardsEl = document.getElementById('cards');
  let allRows = [];
  let expanded = null;
  let menuState = { groups: [], group: null, kpi: null };

  const kpisOf = (group) => {
    const seen = new Map();
    allRows.filter((r) => r.group === group).forEach((r) => { if (!seen.has(r.kpi)) seen.set(r.kpi, r); });
    return [...seen.values()].sort((a, b) => (a.kpi_order ?? 0) - (b.kpi_order ?? 0));
  };

  function el(tag, attrs = {}, text) {
    const e = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    if (text != null) e.textContent = text;
    return e;
  }
  const NS = 'http://www.w3.org/2000/svg';
  function icon(paths, extra = {}) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', extra.sw ?? '1.8'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
    s.setAttribute('aria-hidden', 'true');
    paths.forEach((d) => {
      if (d.startsWith('c:')) { const [cx, cy, r] = d.slice(2).split(','); const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r); s.appendChild(c); }
      else { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); s.appendChild(p); }
    });
    if (extra.cls) s.setAttribute('class', extra.cls);
    return s;
  }
  const ICONS = {
    mch: ['M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z'],
    vac: ['M18 2l4 4', 'M16 4l4 4', 'M18 6L8.5 15.5l-3 1 1-3L16 4', 'M10 10l4 4', 'M3 21l3.5-3.5'],
    ncd: ['M3 12h4l2.2-5 4.2 10 2.2-5H21'],
    eld: ['c:10,4.5,2', 'M10 7.5v6l-2.5 7.5', 'M10 13.5l3 7.5', 'M10 9.5l4.5 2.5', 'M17 12v9'],
    dot: ['c:12,12,3'],
    chev: ['M9 6l6 6-6 6'],
    pin: ['M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z', 'c:12,10,2.5'],
    map: ['M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z', 'M9 3v15', 'M15 6v15'],
    check: ['c:12,12,9', 'M8 12.5l3 3 5-6'],
    star: ['M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'],
    people: ['c:9,8,3.5', 'M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5', 'c:17,9,2.5', 'M16.5 14.6c2.6.3 4.3 2 5 4.9'],
  };
  ICONS.home = ['M3 13h8V3H3z', 'M13 21h8V11h-8z', 'M13 3h8v5h-8z', 'M3 21h8v-5H3z'];
  const OVERVIEW = '__overview';
  const groupIcon = (g) => (g.includes('แม่') ? ICONS.mch : g.includes('ภูมิคุ้มกัน') || g.includes('วัคซีน') ? ICONS.vac : g.includes('NCD') || g.includes('ไม่ติดต่อ') ? ICONS.ncd : g.includes('สูงอายุ') ? ICONS.eld : ICONS.dot);

  function renderMenu() {
    const { groups, group, kpi } = menuState;
    const ov = el('button', { type: 'button', class: 'ky-grp' + (kpi === OVERVIEW ? ' ky-active' : ''), 'data-overview': '1', 'aria-current': String(kpi === OVERVIEW) });
    ov.append(icon(ICONS.home), el('span', {}, 'ภาพรวมทั้งอำเภอ'));
    const items = [ov, el('div', { class: 'ky-menu-label' }, 'กลุ่มงาน')];
    groups.forEach((g) => {
      const open = expanded.has(g);
      const b = el('button', { type: 'button', class: 'ky-grp' + (g === group && kpi !== OVERVIEW ? ' ky-active' : ''), 'data-group': g, 'aria-expanded': String(open) });
      b.append(icon(groupIcon(g)), el('span', {}, g), icon(ICONS.chev, { cls: 'ky-chev', sw: '2' }));
      items.push(b);
      if (open) {
        const subs = el('div', { class: 'ky-subs' });
        kpisOf(g).forEach((k) => subs.append(el('button', { type: 'button', class: 'ky-sub', 'data-kpi': k.kpi, 'data-group-of': g, 'aria-current': String(k.kpi === kpi) }, k.kpi_name)));
        items.push(subs);
      }
    });
    menuEl.replaceChildren(...items);
  }

  menuEl.addEventListener('click', (ev) => {
    if (ev.target.closest('button[data-overview]')) {
      dash.setParams({ kpi: OVERVIEW });
      sideEl.classList.remove('ky-open'); toggleEl.setAttribute('aria-expanded', 'false');
      return;
    }
    const g = ev.target.closest('button[data-group]');
    if (g) {
      const name = g.dataset.group;
      if (expanded.has(name)) expanded.delete(name); else expanded.add(name);
      renderMenu();
      return;
    }
    const k = ev.target.closest('button[data-kpi]');
    if (k) {
      dash.setParams({ group: k.dataset.groupOf, kpi: k.dataset.kpi });
      sideEl.classList.remove('ky-open'); toggleEl.setAttribute('aria-expanded', 'false');
    }
  });
  toggleEl.addEventListener('click', () => {
    const open = sideEl.classList.toggle('ky-open');
    toggleEl.setAttribute('aria-expanded', String(open));
  });

  const swatch = (color, label) => { const s = el('span'); const i = el('i', { class: 'ky-sw' }); i.style.background = color; s.append(i, label); return s; };
  const dashLine = () => { const s = el('span'); s.append(el('i', { class: 'ky-dash' }), 'เกณฑ์'); return s; };

  function tip(box) {
    let t = box.querySelector('.ky-tip');
    if (!t) { t = el('div', { class: 'ky-tip' }); t.hidden = true; box.appendChild(t); }
    return {
      show(ev, lines) {
        t.replaceChildren(...lines.map((s, i) => el('div', i === 0 ? { class: 'k' } : {}, s)));
        t.hidden = false;
        const r = box.getBoundingClientRect();
        let x = ev.clientX - r.left + 12;
        if (x + t.offsetWidth > box.clientWidth) x = ev.clientX - r.left - t.offsetWidth - 12;
        t.style.left = Math.max(0, x) + 'px'; t.style.top = (ev.clientY - r.top + 12) + 'px';
      },
      hide() { t.hidden = true; },
    };
  }

  function tile(cls, iconPaths, label, big, sub) {
    const t = el('div', { class: `ky-tile ${cls}` });
    t.append(el('div', { class: 'lbl' }, label), big, el('div', { class: 'sub' }, sub));
    t.appendChild(icon(iconPaths, { sw: '1.4' }));
    return t;
  }
  const markedPct = (where, field, value) => {
    const d = el('div', { class: 'big' });
    d.append(el('span', { 'data-source': 'hdc', 'data-field': field, 'data-where': where }, f2(value)), el('small', {}, '%'));
    return d;
  };

  function buildSection(rows) {
    const prov = rows.find((r) => r.level === 'จังหวัด');
    const dist = rows.find((r) => r.level === 'อำเภอ');
    const id = `${prov.kpi}-${prov.sub}`;
    const enc = (v) => encodeURIComponent(v);
    const whereP = `kpi=${enc(prov.kpi)}&sub=${enc(prov.sub)}&code=58`;
    const whereD = `kpi=${enc(prov.kpi)}&sub=${enc(prov.sub)}&code=5802`;
    const hasTarget = prov.target != null && prov.target !== '';
    const target = Number(prov.target);
    const multi = seriesOf(prov);
    const two = multi.length > 1;
    const sec = el('section', { class: 'ky-sec', id: `sec-${id}` });

    const head = el('div');
    if (prov.sub_name !== prov.kpi_name) head.append(el('h2', { 'data-source': 'hdc', 'data-field': 'sub_name', 'data-where': whereP }, prov.sub_name));
    const note = el('div', { class: 'ky-note' });
    note.append(el('span', { 'data-source': 'hdc', 'data-field': 'period', 'data-where': whereP }, prov.period), ' · ');
    if (hasTarget) note.append('เกณฑ์ ' + (target < 100 ? '≥ ' : ''), el('span', { 'data-source': 'hdc', 'data-field': 'target', 'data-where': whereP }, prov.target), '%');
    else note.append('ไม่มีเกณฑ์');
    note.append(' · ข้อมูล HDC ณ ', el('span', { 'data-source': 'hdc', 'data-field': 'processed', 'data-where': whereP }, thDate(prov.processed)));
    if (Date.now() - new Date(prov.processed + 'T00:00:00') > 365 * 864e5) note.append(' ', el('span', { class: 'ky-old' }, 'HDC ยังไม่อัปเดตรายงานนี้'));
    head.append(note);
    sec.append(head);

    // tiles
    const s1 = two ? ` (${multi[0].label})` : '';
    const status = !hasTarget ? 'ไม่มีเกณฑ์' : dist.pct >= target ? `ผ่านเกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%` : `ต่ำกว่าเกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%`;
    const diff = dist.pct - prov.pct;
    const fac = rows.filter((r) => r.level === 'หน่วยบริการ');
    const withB = fac.filter((r) => r.B > 0);
    const t1 = tile('ky-t1', ICONS.pin, 'อำเภอขุนยวม' + s1, markedPct(whereD, 'pct', dist.pct), status);
    if (hasTarget && dist.pct < target) t1.classList.add('ky-miss');
    const t2 = tile('ky-t2', ICONS.map, 'จังหวัดแม่ฮ่องสอน' + s1, markedPct(whereP, 'pct', prov.pct),
      `ขุนยวม${diff >= 0 ? 'สูงกว่า' : 'ต่ำกว่า'}จังหวัด ${f2(Math.abs(diff))} จุด`);
    let t3;
    if (hasTarget) {
      const pass = withB.filter((r) => r.pct >= target).length;
      const big = el('div', { class: 'big' }); big.append(`${pass} / ${withB.length}`, el('small', {}, ' แห่ง'));
      t3 = tile('ky-t3', ICONS.check, 'หน่วยบริการผ่านเกณฑ์' + s1, big, withB.length < fac.length ? `ไม่นับ ${fac.length - withB.length} แห่งที่ไม่มีกลุ่มเป้าหมาย` : `จากทั้งหมด ${fac.length} แห่ง`);
    } else {
      const best = [...withB].sort((a, b) => b.pct - a.pct)[0];
      const big = el('div', { class: 'big' }); big.append(best ? f2(best.pct) : '—', el('small', {}, best ? '%' : ''));
      t3 = tile('ky-t3', ICONS.star, 'หน่วยบริการสูงสุด' + s1, big, best ? best.name : 'ไม่มีข้อมูล');
    }
    const bigA = el('div', { class: 'big' });
    bigA.append(el('span', { 'data-source': 'hdc', 'data-field': 'A', 'data-where': whereD }, Number(dist.A).toLocaleString()),
      el('small', {}, ' / '), el('span', { 'data-source': 'hdc', 'data-field': 'B', 'data-where': whereD }, Number(dist.B).toLocaleString()), el('small', {}, ' ราย'));
    const t4label = dist.b_label ? `${dist.a_label} / ${dist.b_label}` : 'ผลงาน / กลุ่มเป้าหมาย อำเภอ';
    const t4 = tile('ky-t4', ICONS.people, t4label + s1, bigA, dist.b_label ? 'อำเภอขุนยวม' : 'จำนวนรายของอำเภอขุนยวม');
    const tiles = el('div', { class: 'ky-tiles' });
    tiles.append(t1, t2, t3, t4);
    sec.append(tiles);

    // chart + gauge
    const row = el('div', { class: 'ky-row' });
    const card = el('div', { class: 'ky-card', id: `card-${id}` });
    card.append(el('h3', {}, 'ผลงานรายหน่วยบริการ'));
    const legend = el('div', { class: 'ky-legend' });
    if (two) {
      multi.forEach((m, i) => legend.append(swatch(seriesColor(i, multi.length), m.label)));
      if (hasTarget) legend.append(swatch(PAL.bad, 'ต่ำกว่าเกณฑ์'), dashLine());
    } else if (hasTarget) {
      legend.append(swatch(PAL.sum, 'ภาพรวม'), swatch(PAL.pass, 'ผ่านเกณฑ์'), swatch(PAL.bad, 'ต่ำกว่าเกณฑ์'), dashLine());
    } else {
      legend.append(swatch(PAL.sum, 'ภาพรวม'), swatch(PAL.pass, 'หน่วยบริการ'));
    }
    card.append(legend);
    const box = el('div', { class: 'ky-chart', id: `chart-${id}`, 'data-source': 'hdc' });
    card.append(box);
    const gcard = el('div', { class: 'ky-card ky-gauge-card', id: `gauge-${id}` });
    gcard.append(el('h3', {}, 'ผลงานอำเภอขุนยวม' + s1));
    const gbox = el('div', { class: 'ky-gauge', 'data-source': 'hdc' });
    const gnote = el('div', { class: 'ky-gauge-note' });
    if (hasTarget) {
      const ok = dist.pct >= target;
      gnote.append(el('b', { class: ok ? 'ky-ok-text' : 'ky-bad-text' }, ok ? 'ผ่านเกณฑ์' : 'ต่ำกว่าเกณฑ์'), ` · เกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%`);
    } else {
      gnote.append(`จังหวัด ${f2(prov.pct)}%`);
    }
    gcard.append(gbox, gnote);
    row.append(card, gcard);
    sec.append(row);
    return { sec, box, gbox };
  }

  function drawGauge(box, rows) {
    box.querySelector('svg')?.remove();
    const prov = rows.find((r) => r.level === 'จังหวัด');
    const dist = rows.find((r) => r.level === 'อำเภอ');
    if (!prov || !dist) return;
    const hasTarget = prov.target != null && prov.target !== '';
    const target = Number(prov.target);
    const v = dist.pct;
    const vals = [v, prov.pct];
    const zoom = !hasTarget && Math.max(...rows.map((r) => r.pct)) < 20;
    const hi = zoom ? d3.nice(0, Math.max(Math.max(...rows.map((r) => r.pct)) * 1.1, 1), 5)[1] : 100;
    const lo = Math.min(0, ...vals) < 0 ? Math.floor(Math.min(...vals) / 25) * 25 : 0;
    const W = Math.min(box.clientWidth || 240, 280), R = W / 2 - 14, cx = W / 2, cy = R + 14, H = cy + 30;
    const a = d3.scaleLinear([lo, hi], [-Math.PI / 2, Math.PI / 2]).clamp(true);
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).style('max-width', `${W}px`).style('display', 'block').style('margin', '0 auto');
    const g = svg.append('g').attr('transform', `translate(${cx},${cy})`);
    const arc = d3.arc().innerRadius(R - 16).outerRadius(R).cornerRadius(3);
    g.append('path').attr('d', arc({ startAngle: -Math.PI / 2, endAngle: Math.PI / 2 })).attr('fill', 'var(--cds-chart-grid)');
    const below = hasTarget && v < target;
    const from = a(Math.max(lo, 0)), to = a(v);
    g.append('path').attr('d', arc({ startAngle: Math.min(from, to), endAngle: Math.max(from, to) + 0.0001 })).attr('fill', below ? PAL.bad : tint(85));
    if (hasTarget) {
      const t = a(target);
      g.append('line').attr('x1', Math.sin(t) * (R - 22)).attr('y1', -Math.cos(t) * (R - 22)).attr('x2', Math.sin(t) * (R + 5)).attr('y2', -Math.cos(t) * (R + 5))
        .attr('stroke', 'var(--cds-chart-reference)').attr('stroke-width', 2.5).attr('stroke-dasharray', '4 2');
    }
    g.append('text').attr('class', 'ky-gval').attr('text-anchor', 'middle').attr('y', -6).text(f2(v) + '%');
    g.append('text').attr('class', 'ky-tick').attr('text-anchor', 'start').attr('x', -R).attr('y', 18).text(lo + '%');
    g.append('text').attr('class', 'ky-tick').attr('text-anchor', 'end').attr('x', R).attr('y', 18).text(hi + '%');
  }

  function drawChart(box, rows) {
    box.querySelector('svg')?.remove();
    const prov = rows.find((r) => r.level === 'จังหวัด');
    const dist = rows.find((r) => r.level === 'อำเภอ');
    if (!prov || !dist) return;
    const hasTarget = prov.target != null && prov.target !== '';
    const target = Number(prov.target);
    const multi = seriesOf(prov);
    const two = multi.length > 1;
    const fac = rows.filter((r) => r.level === 'หน่วยบริการ').sort((a, b) => (b.B > 0) - (a.B > 0) || b.pct - a.pct);
    const items = [
      { ...prov, label: 'ภาพรวมจังหวัดแม่ฮ่องสอน', kind: 'sum' },
      { ...dist, label: 'ภาพรวมอำเภอขุนยวม', kind: 'sum' },
      ...fac.map((r) => ({ ...r, label: r.name, kind: 'fac' })),
    ];

    const nS = two ? multi.length : 1;
    const barH = !two ? 22 : nS > 2 ? 11 : 16;
    const rowH = !two ? 38 : nS * (barH + 2) + 12;
    const W = box.clientWidth, gapAfterSum = 18, top = 6, bottom = 28;
    const yPos = items.map((_, i) => top + i * rowH + (i >= 2 ? gapAfterSum : 0));
    const H = yPos[yPos.length - 1] + rowH + bottom;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const measure = (txt, cls) => { const n = svg.append('text').attr('class', cls).text(txt); const w = n.node().getComputedTextLength(); n.remove(); return w; };
    const left = Math.min(W * 0.42, Math.max(...items.map((r) => measure(r.label, r.kind === 'sum' ? 'ky-strong' : null)))) + 14;
    const right = measure('ไม่มีกลุ่มเป้าหมาย') + 10;

    const vals = items.flatMap((r) => (two ? multi.map((m) => r[m.key]) : [r.pct]));
    const dataMax = Math.max(...vals);
    const zoom = !hasTarget && dataMax < 20;
    const vMin = Math.min(0, ...vals), vMax = zoom ? d3.nice(0, Math.max(dataMax * 1.1, 1), 5)[1] : Math.max(100, dataMax);
    const neg = vMin < 0;
    const labelW = measure('-000.00%', 'ky-strong') + 8;
    const plotW = Math.max(40, W - right - left);
    const lo = neg ? vMin - (vMax - vMin) * labelW / Math.max(40, plotW - labelW) : 0;
    const x = d3.scaleLinear([lo, vMax], [left, W - right]);
    const ticks = neg ? x.ticks(6).filter((v) => v >= vMin - 1e-9) : zoom ? x.ticks(5) : [0, 25, 50, 75, 100];

    svg.append('g').selectAll('line').data(ticks).join('line')
      .attr('x1', x).attr('x2', x).attr('y1', top).attr('y2', H - bottom).attr('stroke', 'var(--cds-chart-grid)');
    svg.append('g').selectAll('text').data(ticks).join('text').attr('class', 'ky-tick')
      .attr('x', x).attr('y', H - 8).attr('text-anchor', 'middle').text((v) => v + '%');
    if (neg) svg.append('line').attr('x1', x(0)).attr('x2', x(0)).attr('y1', top).attr('y2', H - bottom).attr('stroke', 'var(--cds-chart-axis)');
    svg.append('line').attr('x1', 0).attr('x2', W).attr('y1', yPos[2] - gapAfterSum / 2 - 2).attr('y2', yPos[2] - gapAfterSum / 2 - 2)
      .attr('stroke', 'var(--color-border-line)');

    const below = (v) => hasTarget && v < target;
    const barX = (v) => Math.min(x(0), x(v));
    const barW = (v) => Math.max(2, Math.abs(x(v) - x(0)));
    const valX = (v) => (v < 0 ? x(v) - 6 : x(v) + 8);
    const valAnchor = (v) => (v < 0 ? 'end' : 'start');
    const fill = (r) => (r.kind === 'sum' ? PAL.sum : below(r.pct) ? PAL.bad : PAL.pass);
    const t = tip(box);
    const g = svg.append('g').selectAll('g').data(items).join('g').attr('transform', (_, i) => `translate(0,${yPos[i]})`);
    g.filter((r) => r.level === 'อำเภอ').append('rect')
      .attr('x', 0).attr('y', 2).attr('width', W).attr('height', rowH - 4).attr('rx', 6).attr('fill', tint(12));
    g.append('text').attr('x', left - 10).attr('y', rowH / 2).attr('dy', '0.35em').attr('text-anchor', 'end')
      .attr('class', (r) => (r.kind === 'sum' ? 'ky-strong' : null)).text((r) => r.label);

    const tipLines = (r) => {
      if (two) return [r.label, ...multi.map((m) => `${m.label} ${f2(r[m.key])}% (${Number(r[m.A]).toLocaleString()} จาก ${Number(r[m.B] ?? r.B).toLocaleString()} ราย)`)];
      if (r.b_label) return [r.label, `${r.v_label ?? 'ร้อยละ'} ${f2(r.pct)}%`, `${r.b_label} ${r.B.toLocaleString()} ราย`, `${r.a_label} ${r.A.toLocaleString()} ราย`];
      return [r.label, `ร้อยละ ${f2(r.pct)}%`, `ผลงาน ${r.A.toLocaleString()} จาก ${r.B.toLocaleString()} ราย`];
    };

    if (two) {
      const blockH = nS * (barH + 2) - 2;
      const series = multi.map((m, i) => ({ key: m.key, color: seriesColor(i, nS), y: rowH / 2 - blockH / 2 + i * (barH + 2) }));
      series.forEach((s) => {
        g.filter((r) => r.B > 0).append('rect')
          .attr('x', (r) => barX(r[s.key])).attr('y', s.y).attr('height', barH).attr('rx', 4)
          .attr('width', (r) => barW(r[s.key])).attr('fill', (r) => (below(r[s.key]) ? PAL.bad : s.color));
        g.filter((r) => r.B > 0).append('text')
          .attr('class', (r) => (below(r[s.key]) ? 'ky-strong ky-below' : 'ky-strong'))
          .attr('x', (r) => valX(r[s.key])).attr('text-anchor', (r) => valAnchor(r[s.key]))
          .attr('y', s.y + barH / 2).attr('dy', '0.35em')
          .style('font-size', 'var(--cds-font-size-caption)').text((r) => f2(r[s.key]) + '%');
      });
      g.filter((r) => r.B === 0).append('text').attr('x', x(0) + 4).attr('y', rowH / 2).attr('dy', '0.35em').text('ไม่มีกลุ่มเป้าหมาย');
    } else {
      g.filter((r) => r.B > 0).append('rect')
        .attr('x', (r) => barX(r.pct)).attr('y', (rowH - barH) / 2).attr('height', barH).attr('rx', 4)
        .attr('width', (r) => barW(r.pct)).attr('fill', fill);
      g.append('text')
        .attr('class', (r) => (r.B > 0 ? 'ky-strong' : null))
        .attr('x', (r) => (r.B > 0 ? valX(r.pct) : x(0) + 4)).attr('text-anchor', (r) => (r.B > 0 ? valAnchor(r.pct) : 'start'))
        .attr('y', rowH / 2).attr('dy', '0.35em')
        .text((r) => (r.B > 0 ? f2(r.pct) + '%' : 'ไม่มีกลุ่มเป้าหมาย'));
    }
    g.append('rect').attr('x', 0).attr('width', W).attr('height', rowH).attr('fill', 'transparent')
      .on('mousemove', (ev, r) => t.show(ev, tipLines(r)))
      .on('mouseleave', () => t.hide());

    if (hasTarget) svg.append('line').attr('x1', x(target)).attr('x2', x(target)).attr('y1', top - 4).attr('y2', H - bottom)
      .attr('stroke', 'var(--cds-chart-reference)').attr('stroke-dasharray', '5 4').attr('stroke-width', 2);
  }

  function buildOverview(groups) {
    const out = [];
    const cards = [];
    groups.forEach((g) => {
      const sec = el('section', { class: 'ky-sec', id: `ov-${groups.indexOf(g)}` });
      sec.append(el('h2', {}, g));
      const grid = el('div', { class: 'ky-ov-grid' });
      kpisOf(g).forEach((k) => {
        const rows = allRows.filter((r) => r.kpi === k.kpi);
        const subs = [...new Map(rows.map((r) => [r.sub, r.sub_order ?? 1])).entries()].sort((a, b) => a[1] - b[1]).map(([s]) => s);
        subs.forEach((s) => {
          const rs = rows.filter((r) => r.sub === s);
          const prov = rs.find((r) => r.level === 'จังหวัด');
          const dist = rs.find((r) => r.level === 'อำเภอ');
          if (!prov || !dist) return;
          const multi = seriesOf(dist);
          const tag = multi.length > 1 ? ` (${multi[0].label})` : '';
          const hasTarget = prov.target != null && prov.target !== '';
          const target = Number(prov.target);
          const state = !hasTarget ? 'none' : dist.pct >= target ? 'ok' : 'bad';
          cards.push(state);
          const where = `kpi=${encodeURIComponent(prov.kpi)}&sub=${encodeURIComponent(prov.sub)}&code=5802`;
          const c = el('button', { type: 'button', class: 'ky-ov', 'data-go-kpi': k.kpi, 'data-go-group': g });
          c.style.setProperty('--ky-ov-c', state === 'ok' ? 'var(--ky-t2)' : state === 'bad' ? 'var(--color-bad)' : tint(45));
          c.append(el('span', { class: 'nm' }, prov.sub_name + tag));
          const vals = el('span', { class: 'vals' });
          const v = el('span', { class: 'v' });
          v.append(el('span', { 'data-source': 'hdc', 'data-field': 'pct', 'data-where': where }, f2(dist.pct)), el('small', {}, '%'));
          vals.append(v, el('span', { class: 'pv' }, `จังหวัด ${f2(prov.pct)}%`));
          c.append(vals);
          const bar = el('span', { class: 'bar' });
          const fill = el('i');
          const hi = !hasTarget && Math.max(dist.pct, prov.pct) < 20 ? d3.nice(0, Math.max(dist.pct, prov.pct, 1) * 1.25, 4)[1] : 100;
          fill.style.width = Math.max(0, Math.min(100, (dist.pct / hi) * 100)) + '%';
          fill.style.background = state === 'bad' ? PAL.bad : PAL.pass;
          bar.append(fill);
          if (hasTarget) { const m = el('b'); m.style.left = `calc(${Math.min(100, (target / hi) * 100)}% - 1px)`; bar.append(m); }
          c.append(bar);
          c.append(el('span', { class: `ky-pill ${state}` }, state === 'ok' ? `ผ่านเกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%` : state === 'bad' ? `ต่ำกว่าเกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%` : 'ไม่มีเกณฑ์'));
          grid.append(c);
        });
      });
      sec.append(grid);
      out.push(sec);
    });
    const n = (st) => cards.filter((x) => x === st).length;
    const withT = n('ok') + n('bad');
    const tiles = el('div', { class: 'ky-tiles' });
    const big = (a, b) => { const d = el('div', { class: 'big' }); d.append(a, el('small', {}, b)); return d; };
    tiles.append(
      tile('ky-t1', ICONS.check, 'ตัวชี้วัดที่ผ่านเกณฑ์', big(`${n('ok')} / ${withT}`, ' ตัว'), `จากตัวชี้วัดที่มีเกณฑ์ ${withT} ตัว`),
      tile('ky-t2', ICONS.map, 'ร้อยละที่ผ่านเกณฑ์', big(withT ? f2((n('ok') * 100) / withT) : '—', '%'), 'ของตัวชี้วัดที่มีเกณฑ์'),
      tile('ky-t3', ICONS.pin, 'ต่ำกว่าเกณฑ์', big(String(n('bad')), ' ตัว'), 'กดการ์ดสีแดงด้านล่างเพื่อดูรายละเอียด'),
      tile('ky-t4', ICONS.people, 'ไม่มีเกณฑ์ (ติดตามผล)', big(String(n('none')), ' ตัว'), 'แสดงผลงานเพื่อติดตาม'),
    );
    const head = el('section', { class: 'ky-sec' });
    head.append(el('div', { class: 'ky-note' }, 'ผลงานอำเภอขุนยวมทุกตัวชี้วัด เทียบกับเกณฑ์และภาพรวมจังหวัด · กดการ์ดเพื่อดูรายหน่วยบริการ'), tiles);
    return [head, ...out];
  }

  cardsEl.addEventListener('click', (ev) => {
    const c = ev.target.closest('button[data-go-kpi]');
    if (c) { dash.setParams({ group: c.dataset.goGroup, kpi: c.dataset.goKpi }); window.scrollTo({ top: 0 }); }
  });

  dash.onData(() => {
    const h = dash.data('hdc');
    allRows = h.status === 'ok' ? h.data.map((r) => ({ ...r, code: String(r.code), sub: r.sub ?? 'main' })) : [];
    const groups = [...new Set(allRows.map((r) => r.group))];
    const p = dash.params();
    const group = groups.includes(p.group) ? p.group : groups[0];
    const kpis = kpisOf(group);
    const kpi = !p.kpi || p.kpi === OVERVIEW ? OVERVIEW : kpis.some((k) => k.kpi === p.kpi) ? p.kpi : kpis[0]?.kpi;
    document.getElementById('ky-app').style.setProperty('--ky-accent', dash.colors[0]);

    if (!expanded) expanded = new Set(group && kpi !== OVERVIEW ? [group] : []);
    if (group && kpi !== OVERVIEW && menuState.kpi !== kpi) expanded.add(group);
    menuState = { groups, group, kpi };
    renderMenu();

    const latest = allRows.reduce((m, r) => (r.processed > m ? r.processed : m), '');
    document.getElementById('ky-latest').textContent = latest ? thDate(latest) : '—';
    if (kpi === OVERVIEW) {
      document.getElementById('ky-title').textContent = 'ภาพรวมทั้งอำเภอ';
      document.getElementById('ky-crumb').textContent = 'หน้าหลัก / ภาพรวมทั้งอำเภอ';
      cardsEl.replaceChildren(...buildOverview(groups));
      return;
    }
    const rows = allRows.filter((r) => r.kpi === kpi);
    const first = rows[0];
    document.getElementById('ky-title').textContent = first ? first.kpi_name : '—';
    document.getElementById('ky-crumb').textContent = `หน้าหลัก / ${group ?? ''}`;

    const subs = [...new Map(rows.map((r) => [r.sub, r.sub_order ?? 1])).entries()].sort((a, b) => a[1] - b[1]).map(([s]) => s);
    const built = subs.map((s) => { const rs = rows.filter((r) => r.sub === s); return { rows: rs, ...buildSection(rs) }; });
    cardsEl.replaceChildren(...built.map((b) => b.sec));
    built.forEach((b) => { drawChart(b.box, b.rows); drawGauge(b.gbox, b.rows); });
  });
</script>

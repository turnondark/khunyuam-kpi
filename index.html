<script>
  // Stand-in for the dashboard runtime: data is embedded in the page, so no sign-in is needed.
  window.dash = (() => {
    let fn = null;
    let params = {};
    let rows = null;
    let published = null;
    let finance = null;
    let pa = null;
    let assign = null;
    const embedded = () => {
      if (rows) return;
      const d = document.getElementById('hdc-data');
      const m = document.getElementById('hdc-meta');
      const f = document.getElementById('hdc-fin');
      rows = d ? JSON.parse(d.textContent) : [];
      published = m ? JSON.parse(m.textContent).published : null;
      finance = f ? JSON.parse(f.textContent) : { months: [], all_units: [] };
      const p = document.getElementById('hdc-pa');
      pa = p ? JSON.parse(p.textContent) : null;
      const s = document.getElementById('hdc-assign');
      assign = s ? JSON.parse(s.textContent) : null;
    };
    const run = () => { if (fn) fn(); };
    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(run, 150); });
    const api = {
      colors: ['var(--accent)'],
      data: () => { embedded(); return { status: 'ok', data: rows }; },
      get published() { embedded(); return published; },
      get finance() { embedded(); return finance; },
      get pa() { embedded(); return pa; },
      get assign() { embedded(); return assign; },
      // Fetch the newest published data.json from the same site; falls back to a full page reload.
      reload: async () => {
        embedded();
        let res;
        try { res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' }); } catch (e) { res = null; }
        if (!res || !res.ok) { location.reload(); return { changed: false }; }
        const j = await res.json();
        const changed = j.published !== published;
        rows = j.rows; published = j.published; if (j.finance) finance = j.finance; if (j.pa) pa = j.pa; if (j.assign) assign = j.assign;
        run();
        return { changed };
      },
      params: () => params,
      setParams: (p) => { params = { ...params, ...p }; run(); },
      onData: (f) => { fn = f; if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run(); },
    };
    return api;
  })();
</script>

    const items = [ov, el('div', { class: 'ky-menu-label' }, 'กลุ่มงาน')];
    groups.forEach((g) => {
      const open = expanded.has(g);
      const b = el('button', { type: 'button', class: 'ky-grp' + (g === group && kpi !== OVERVIEW ? ' ky-active' : ''), 'data-group': g, 'aria-expanded': String(open) });
      b.append(icon(groupIcon(g)), el('span', {}, g), icon(ICONS.chev, { cls: 'ky-chev', sw: '2' }));
      items.push(b);
      if (open) {
        const subs = el('div', { class: 'ky-subs' });
        kpisOf(g).forEach((k) => subs.append(el('button', { type: 'button', class: 'ky-sub', 'data-kpi': k.kpi, 'data-group-of': g, 'aria-current': String(k.kpi === kpi) }, k.kpi_name)));
        items.push(subs);
      }
    });
    menuEl.replaceChildren(...items);
  }

  menuEl.addEventListener('click', (ev) => {
    if (ev.target.closest('button[data-overview]')) {
      dash.setParams({ kpi: OVERVIEW });
      sideEl.classList.remove('ky-open'); toggleEl.setAttribute('aria-expanded', 'false');
      return;
    }
    const g = ev.target.closest('button[data-group]');
    if (g) {
      const name = g.dataset.group;
      if (expanded.has(name)) expanded.delete(name); else expanded.add(name);
      renderMenu();
      return;
    }
    const k = ev.target.closest('button[data-kpi]');
    if (k) {
      dash.setParams({ group: k.dataset.groupOf, kpi: k.dataset.kpi });
      sideEl.classList.remove('ky-open'); toggleEl.setAttribute('aria-expanded', 'false');
    }
  });
  const refreshBtn = document.getElementById('ky-refresh');
  const refreshMsg = document.getElementById('ky-refresh-msg');
  const thDateTime = (iso) => new Date(iso).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' น.';
  let msgTimer;
  refreshBtn.addEventListener('click', async () => {
    if (refreshBtn.getAttribute('aria-busy') === 'true') return;
    refreshBtn.setAttribute('aria-busy', 'true');
    refreshBtn.querySelector('span').textContent = 'กำลังอัปเดต…';
    clearTimeout(msgTimer);
    let msg = '';
    try {
      if (dash.reload) {
        const r = await dash.reload();
        msg = r.changed ? 'อัปเดตเป็นข้อมูลชุดใหม่แล้ว' : 'เป็นข้อมูลล่าสุดอยู่แล้ว';
      } else if (dash.refresh) {
        dash.refresh('hdc');
        msg = 'อัปเดตแล้ว';
      } else {
        location.reload();
        return;
      }
    } catch (e) {
      msg = 'อัปเดตไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่';
    }
    refreshBtn.setAttribute('aria-busy', 'false');
    refreshBtn.querySelector('span').textContent = 'อัปเดตข้อมูล';
    refreshMsg.textContent = `· ${msg} (${new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.)`;
    msgTimer = setTimeout(() => { refreshMsg.textContent = ''; }, 8000);
  });

  toggleEl.addEventListener('click', () => {
    const open = sideEl.classList.toggle('ky-open');
    toggleEl.setAttribute('aria-expanded', String(open));
  });

  const swatch = (color, label) => { const s = el('span'); const i = el('i', { class: 'ky-sw' }); i.style.background = color; s.append(i, label); return s; };
  const dashLine = () => { const s = el('span'); s.append(el('i', { class: 'ky-dash' }), 'เกณฑ์'); return s; };

  function tip(box) {
    let t = box.querySelector('.ky-tip');
    if (!t) { t = el('div', { class: 'ky-tip' }); t.hidden = true; box.appendChild(t); }
    return {
      show(ev, lines) {
        t.replaceChildren(...lines.map((s, i) => el('div', i === 0 ? { class: 'k' } : {}, s)));
        t.hidden = false;
        const r = box.getBoundingClientRect();
        let x = ev.clientX - r.left + 12;
        if (x + t.offsetWidth > box.clientWidth) x = ev.clientX - r.left - t.offsetWidth - 12;
        t.style.left = Math.max(0, x) + 'px'; t.style.top = (ev.clientY - r.top + 12) + 'px';
      },
      hide() { t.hidden = true; },
    };
  }

  function tile(cls, iconPaths, label, big, sub) {
    const t = el('div', { class: `ky-tile ${cls}` });
    t.append(el('div', { class: 'lbl' }, label), big, el('div', { class: 'sub' }, sub));
    t.appendChild(icon(iconPaths, { sw: '1.4' }));
    return t;
  }
  const markedPct = (where, field, value) => {
    const d = el('div', { class: 'big' });
    d.append(el('span', { 'data-source': 'hdc', 'data-field': field, 'data-where': where }, f2(value)), el('small', {}, '%'));
    return d;
  };

  function buildSection(rows) {
    const prov = rows.find((r) => r.level === 'จังหวัด');
    const dist = rows.find((r) => r.level === 'อำเภอ');
    const id = `${prov.kpi}-${prov.sub}`;
    const enc = (v) => encodeURIComponent(v);
    const whereP = `kpi=${enc(prov.kpi)}&sub=${enc(prov.sub)}&code=58`;
    const whereD = `kpi=${enc(prov.kpi)}&sub=${enc(prov.sub)}&code=5802`;
    const hasTarget = prov.target != null && prov.target !== '';
    const target = Number(prov.target);
    const multi = seriesOf(prov);
    const two = multi.length > 1;
    const sec = el('section', { class: 'ky-sec', id: `sec-${id}` });

    const head = el('div');
    if (prov.sub_name !== prov.kpi_name) head.append(el('h2', { 'data-source': 'hdc', 'data-field': 'sub_name', 'data-where': whereP }, prov.sub_name));
    const note = el('div', { class: 'ky-note' });
    note.append(el('span', { 'data-source': 'hdc', 'data-field': 'period', 'data-where': whereP }, prov.period), ' · ');
    if (hasTarget) note.append('เกณฑ์ ' + (target < 100 ? '≥ ' : ''), el('span', { 'data-source': 'hdc', 'data-field': 'target', 'data-where': whereP }, prov.target), '%');
    else note.append('ไม่มีเกณฑ์');
    note.append(' · ข้อมูล HDC ณ ', el('span', { 'data-source': 'hdc', 'data-field': 'processed', 'data-where': whereP }, thDate(prov.processed)));
    if (Date.now() - new Date(prov.processed + 'T00:00:00') > 365 * 864e5) note.append(' ', el('span', { class: 'ky-old' }, 'HDC ยังไม่อัปเดตรายงานนี้'));
    head.append(note);
    sec.append(head);

    // tiles
    const s1 = two ? ` (${multi[0].label})` : '';
    const status = !hasTarget ? 'ไม่มีเกณฑ์' : dist.pct >= target ? `ผ่านเกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%` : `ต่ำกว่าเกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%`;
    const diff = dist.pct - prov.pct;
    const fac = rows.filter((r) => r.level === 'หน่วยบริการ');
    const withB = fac.filter((r) => r.B > 0);
    const t1 = tile('ky-t1', ICONS.pin, 'อำเภอขุนยวม' + s1, markedPct(whereD, 'pct', dist.pct), status);
    if (hasTarget && dist.pct < target) t1.classList.add('ky-miss');
    const t2 = tile('ky-t2', ICONS.map, 'จังหวัดแม่ฮ่องสอน' + s1, markedPct(whereP, 'pct', prov.pct),
      `ขุนยวม${diff >= 0 ? 'สูงกว่า' : 'ต่ำกว่า'}จังหวัด ${f2(Math.abs(diff))} จุด`);
    let t3;
    if (hasTarget) {
      const pass = withB.filter((r) => r.pct >= target).length;
      const big = el('div', { class: 'big' }); big.append(`${pass} / ${withB.length}`, el('small', {}, ' แห่ง'));
      t3 = tile('ky-t3', ICONS.check, 'หน่วยบริการผ่านเกณฑ์' + s1, big, withB.length < fac.length ? `ไม่นับ ${fac.length - withB.length} แห่งที่ไม่มีกลุ่มเป้าหมาย` : `จากทั้งหมด ${fac.length} แห่ง`);
    } else {
      const best = [...withB].sort((a, b) => b.pct - a.pct)[0];
      const big = el('div', { class: 'big' }); big.append(best ? f2(best.pct) : '—', el('small', {}, best ? '%' : ''));
      t3 = tile('ky-t3', ICONS.star, 'หน่วยบริการสูงสุด' + s1, big, best ? best.name : 'ไม่มีข้อมูล');
    }
    const bigA = el('div', { class: 'big' });
    bigA.append(el('span', { 'data-source': 'hdc', 'data-field': 'A', 'data-where': whereD }, Number(dist.A).toLocaleString()),
      el('small', {}, ' / '), el('span', { 'data-source': 'hdc', 'data-field': 'B', 'data-where': whereD }, Number(dist.B).toLocaleString()), el('small', {}, ' ราย'));
    const t4label = dist.b_label ? `${dist.a_label} / ${dist.b_label}` : 'ผลงาน / กลุ่มเป้าหมาย อำเภอ';
    const t4 = tile('ky-t4', ICONS.people, t4label + s1, bigA, dist.b_label ? 'อำเภอขุนยวม' : 'จำนวนรายของอำเภอขุนยวม');
    const tiles = el('div', { class: 'ky-tiles' });
    tiles.append(t1, t2, t3, t4);
    sec.append(tiles);

    // chart + gauge
    const row = el('div', { class: 'ky-row' });
    const card = el('div', { class: 'ky-card', id: `card-${id}` });
    card.append(el('h3', {}, 'ผลงานรายหน่วยบริการ'));
    const legend = el('div', { class: 'ky-legend' });
    if (two) {
      multi.forEach((m, i) => legend.append(swatch(seriesColor(i, multi.length), m.label)));
      if (hasTarget) legend.append(swatch(PAL.bad, 'ต่ำกว่าเกณฑ์'), dashLine());
    } else if (hasTarget) {
      legend.append(swatch(PAL.sum, 'ภาพรวม'), swatch(PAL.pass, 'ผ่านเกณฑ์'), swatch(PAL.bad, 'ต่ำกว่าเกณฑ์'), dashLine());
    } else {
      legend.append(swatch(PAL.sum, 'ภาพรวม'), swatch(PAL.pass, 'หน่วยบริการ'));
    }
    card.append(legend);
    const box = el('div', { class: 'ky-chart', id: `chart-${id}`, 'data-source': 'hdc' });
    card.append(box);
    const gcard = el('div', { class: 'ky-card ky-gauge-card', id: `gauge-${id}` });
    gcard.append(el('h3', {}, 'ผลงานอำเภอขุนยวม' + s1));
    const gbox = el('div', { class: 'ky-gauge', 'data-source': 'hdc' });
    const gnote = el('div', { class: 'ky-gauge-note' });
    if (hasTarget) {
      const ok = dist.pct >= target;
      gnote.append(el('b', { class: ok ? 'ky-ok-text' : 'ky-bad-text' }, ok ? 'ผ่านเกณฑ์' : 'ต่ำกว่าเกณฑ์'), ` · เกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%`);
    } else {
      gnote.append(`จังหวัด ${f2(prov.pct)}%`);
    }
    gcard.append(gbox, gnote);
    row.append(card, gcard);
    sec.append(row);
    return { sec, box, gbox };
  }

  function drawGauge(box, rows) {
    box.querySelector('svg')?.remove();
    const prov = rows.find((r) => r.level === 'จังหวัด');
    const dist = rows.find((r) => r.level === 'อำเภอ');
    if (!prov || !dist) return;
    const hasTarget = prov.target != null && prov.target !== '';
    const target = Number(prov.target);
    const v = dist.pct;
    const vals = [v, prov.pct];
    const zoom = !hasTarget && Math.max(...rows.map((r) => r.pct)) < 20;
    const hi = zoom ? d3.nice(0, Math.max(Math.max(...rows.map((r) => r.pct)) * 1.1, 1), 5)[1] : 100;
    const lo = Math.min(0, ...vals) < 0 ? Math.floor(Math.min(...vals) / 25) * 25 : 0;
    const W = Math.min(box.clientWidth || 240, 280), R = W / 2 - 14, cx = W / 2, cy = R + 14, H = cy + 30;
    const a = d3.scaleLinear([lo, hi], [-Math.PI / 2, Math.PI / 2]).clamp(true);
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).style('max-width', `${W}px`).style('display', 'block').style('margin', '0 auto');
    const g = svg.append('g').attr('transform', `translate(${cx},${cy})`);
    const arc = d3.arc().innerRadius(R - 16).outerRadius(R).cornerRadius(3);
    g.append('path').attr('d', arc({ startAngle: -Math.PI / 2, endAngle: Math.PI / 2 })).attr('fill', 'var(--cds-chart-grid)');
    const below = hasTarget && v < target;
    const from = a(Math.max(lo, 0)), to = a(v);
    g.append('path').attr('d', arc({ startAngle: Math.min(from, to), endAngle: Math.max(from, to) + 0.0001 })).attr('fill', below ? PAL.bad : tint(85));
    if (hasTarget) {
      const t = a(target);
      g.append('line').attr('x1', Math.sin(t) * (R - 22)).attr('y1', -Math.cos(t) * (R - 22)).attr('x2', Math.sin(t) * (R + 5)).attr('y2', -Math.cos(t) * (R + 5))
        .attr('stroke', 'var(--cds-chart-reference)').attr('stroke-width', 2.5).attr('stroke-dasharray', '4 2');
    }
    g.append('text').attr('class', 'ky-gval').attr('text-anchor', 'middle').attr('y', -6).text(f2(v) + '%');
    g.append('text').attr('class', 'ky-tick').attr('text-anchor', 'start').attr('x', -R).attr('y', 18).text(lo + '%');
    g.append('text').attr('class', 'ky-tick').attr('text-anchor', 'end').attr('x', R).attr('y', 18).text(hi + '%');
  }

  function drawChart(box, rows) {
    box.querySelector('svg')?.remove();
    const prov = rows.find((r) => r.level === 'จังหวัด');
    const dist = rows.find((r) => r.level === 'อำเภอ');
    if (!prov || !dist) return;
    const hasTarget = prov.target != null && prov.target !== '';
    const target = Number(prov.target);
    const multi = seriesOf(prov);
    const two = multi.length > 1;
    const fac = rows.filter((r) => r.level === 'หน่วยบริการ').sort((a, b) => (b.B > 0) - (a.B > 0) || b.pct - a.pct);
    const items = [
      { ...prov, label: 'ภาพรวมจังหวัดแม่ฮ่องสอน', kind: 'sum' },
      { ...dist, label: 'ภาพรวมอำเภอขุนยวม', kind: 'sum' },
      ...fac.map((r) => ({ ...r, label: r.name, kind: 'fac' })),
    ];

    const nS = two ? multi.length : 1;
    const barH = !two ? 22 : nS > 2 ? 11 : 16;
    const rowH = !two ? 38 : nS * (barH + 2) + 12;
    const W = box.clientWidth, gapAfterSum = 18, top = 6, bottom = 28;
    const yPos = items.map((_, i) => top + i * rowH + (i >= 2 ? gapAfterSum : 0));
    const H = yPos[yPos.length - 1] + rowH + bottom;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const measure = (txt, cls) => { const n = svg.append('text').attr('class', cls).text(txt); const w = n.node().getComputedTextLength(); n.remove(); return w; };
    const left = Math.min(W * 0.42, Math.max(...items.map((r) => measure(r.label, r.kind === 'sum' ? 'ky-strong' : null)))) + 14;
    const right = measure('ไม่มีกลุ่มเป้าหมาย') + 10;

    const vals = items.flatMap((r) => (two ? multi.map((m) => r[m.key]) : [r.pct]));
    const dataMax = Math.max(...vals);
    const zoom = !hasTarget && dataMax < 20;
    const vMin = Math.min(0, ...vals), vMax = zoom ? d3.nice(0, Math.max(dataMax * 1.1, 1), 5)[1] : Math.max(100, dataMax);
    const neg = vMin < 0;
    const labelW = measure('-000.00%', 'ky-strong') + 8;
    const plotW = Math.max(40, W - right - left);
    const lo = neg ? vMin - (vMax - vMin) * labelW / Math.max(40, plotW - labelW) : 0;
    const x = d3.scaleLinear([lo, vMax], [left, W - right]);
    const ticks = neg ? x.ticks(6).filter((v) => v >= vMin - 1e-9) : zoom ? x.ticks(5) : [0, 25, 50, 75, 100];

    svg.append('g').selectAll('line').data(ticks).join('line')
      .attr('x1', x).attr('x2', x).attr('y1', top).attr('y2', H - bottom).attr('stroke', 'var(--cds-chart-grid)');
    svg.append('g').selectAll('text').data(ticks).join('text').attr('class', 'ky-tick')
      .attr('x', x).attr('y', H - 8).attr('text-anchor', 'middle').text((v) => v + '%');
    if (neg) svg.append('line').attr('x1', x(0)).attr('x2', x(0)).attr('y1', top).attr('y2', H - bottom).attr('stroke', 'var(--cds-chart-axis)');
    svg.append('line').attr('x1', 0).attr('x2', W).attr('y1', yPos[2] - gapAfterSum / 2 - 2).attr('y2', yPos[2] - gapAfterSum / 2 - 2)
      .attr('stroke', 'var(--color-border-line)');

    const below = (v) => hasTarget && v < target;
    const barX = (v) => Math.min(x(0), x(v));
    const barW = (v) => Math.max(2, Math.abs(x(v) - x(0)));
    const valX = (v) => (v < 0 ? x(v) - 6 : x(v) + 8);
    const valAnchor = (v) => (v < 0 ? 'end' : 'start');
    const fill = (r) => (r.kind === 'sum' ? PAL.sum : below(r.pct) ? PAL.bad : PAL.pass);
    const t = tip(box);
    const g = svg.append('g').selectAll('g').data(items).join('g').attr('transform', (_, i) => `translate(0,${yPos[i]})`);
    g.filter((r) => r.level === 'อำเภอ').append('rect')
      .attr('x', 0).attr('y', 2).attr('width', W).attr('height', rowH - 4).attr('rx', 6).attr('fill', tint(12));
    g.append('text').attr('x', left - 10).attr('y', rowH / 2).attr('dy', '0.35em').attr('text-anchor', 'end')
      .attr('class', (r) => (r.kind === 'sum' ? 'ky-strong' : null)).text((r) => r.label);

    const tipLines = (r) => {
      if (two) return [r.label, ...multi.map((m) => `${m.label} ${f2(r[m.key])}% (${Number(r[m.A]).toLocaleString()} จาก ${Number(r[m.B] ?? r.B).toLocaleString()} ราย)`)];
      if (r.b_label) return [r.label, `${r.v_label ?? 'ร้อยละ'} ${f2(r.pct)}%`, `${r.b_label} ${r.B.toLocaleString()} ราย`, `${r.a_label} ${r.A.toLocaleString()} ราย`];
      return [r.label, `ร้อยละ ${f2(r.pct)}%`, `ผลงาน ${r.A.toLocaleString()} จาก ${r.B.toLocaleString()} ราย`];
    };

    if (two) {
      const blockH = nS * (barH + 2) - 2;
      const series = multi.map((m, i) => ({ key: m.key, color: seriesColor(i, nS), y: rowH / 2 - blockH / 2 + i * (barH + 2) }));
      series.forEach((s) => {
        g.filter((r) => r.B > 0).append('rect')
          .attr('x', (r) => barX(r[s.key])).attr('y', s.y).attr('height', barH).attr('rx', 4)
          .attr('width', (r) => barW(r[s.key])).attr('fill', (r) => (below(r[s.key]) ? PAL.bad : s.color));
        g.filter((r) => r.B > 0).append('text')
          .attr('class', (r) => (below(r[s.key]) ? 'ky-strong ky-below' : 'ky-strong'))
          .attr('x', (r) => valX(r[s.key])).attr('text-anchor', (r) => valAnchor(r[s.key]))
          .attr('y', s.y + barH / 2).attr('dy', '0.35em')
          .style('font-size', 'var(--cds-font-size-caption)').text((r) => f2(r[s.key]) + '%');
      });
      g.filter((r) => r.B === 0).append('text').attr('x', x(0) + 4).attr('y', rowH / 2).attr('dy', '0.35em').text('ไม่มีกลุ่มเป้าหมาย');
    } else {
      g.filter((r) => r.B > 0).append('rect')
        .attr('x', (r) => barX(r.pct)).attr('y', (rowH - barH) / 2).attr('height', barH).attr('rx', 4)
        .attr('width', (r) => barW(r.pct)).attr('fill', fill);
      g.append('text')
        .attr('class', (r) => (r.B > 0 ? 'ky-strong' : null))
        .attr('x', (r) => (r.B > 0 ? valX(r.pct) : x(0) + 4)).attr('text-anchor', (r) => (r.B > 0 ? valAnchor(r.pct) : 'start'))
        .attr('y', rowH / 2).attr('dy', '0.35em')
        .text((r) => (r.B > 0 ? f2(r.pct) + '%' : 'ไม่มีกลุ่มเป้าหมาย'));
    }
    g.append('rect').attr('x', 0).attr('width', W).attr('height', rowH).attr('fill', 'transparent')
      .on('mousemove', (ev, r) => t.show(ev, tipLines(r)))
      .on('mouseleave', () => t.hide());

    if (hasTarget) svg.append('line').attr('x1', x(target)).attr('x2', x(target)).attr('y1', top - 4).attr('y2', H - bottom)
      .attr('stroke', 'var(--cds-chart-reference)').attr('stroke-dasharray', '5 4').attr('stroke-width', 2);
  }

  // ===== รายงานการเงิน รพ.สต. (data: data/finance.json, imported from the monthly Excel forms) =====
  const FIN_GROUP = 'รายงานการเงิน รพ.สต.';
  const FIN_KPIS = [{ kpi: '__fin_claim', kpi_name: 'ข้อมูลการเคลม' }, { kpi: '__fin_bal', kpi_name: 'ยอดเงินคงเหลือ' }];
  ICONS.fin = ['M3 7h18v12H3z', 'M3 11h18', 'M7 15h3', 'c:17,15,1.2'];
  const finData = () => {
    if (dash.finance) return dash.finance;
    const d = dash.data && dash.data('finance');
    return d && d.status === 'ok' && d.data && !Array.isArray(d.data) ? d.data : { months: [], all_units: [] };
  };
  const baht = (v) => Number(v).toLocaleString('th-TH', { maximumFractionDigits: 0 });
  const bahtShort = (v) => (Math.abs(v) >= 1e6 ? `${(v / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 2 })} ล้าน` : baht(v));
  const FIN_TYPES = [['pp', 'PP ส่งเสริมป้องกัน'], ['hc', 'HC'], ['pall', 'Palliative care'], ['other', 'อื่น ๆ']];
  const BAL_PARTS = [['uc', 'บัญชีเงิน UC'], ['bamrung', 'บัญชีเงินบำรุง'], ['cash', 'เงินสดในมือ']];
  let finMonth = null;

  function finEmpty(title, lines) {
    const card = el('div', { class: 'ky-card ky-fin-empty' });
    card.append(el('h3', {}, title));
    lines.forEach((t) => card.append(el('p', {}, t)));
    return card;
  }

  function monthChips(fin) {
    const wrap = el('div', { class: 'ky-chips', role: 'group', 'aria-label': 'เดือน' });
    [...fin.months].reverse().forEach((m) => {
      const b = el('button', { type: 'button', class: 'ky-chip', 'data-fin-month': m.ym, 'aria-pressed': String(m.ym === finMonth) }, `${m.month} ${m.month_year ?? ''}`.trim());
      wrap.append(b);
    });
    return wrap;
  }

  // horizontal stacked bars: items [{label, parts:[{v, color, name}], value, valueText, bad}]
  function drawStack(box, items, opts = {}) {
    box.querySelector('svg')?.remove();
    if (!items.length) return;
    const W = box.clientWidth, rowH = 36, barH = 20, top = 6, bottom = 28;
    const H = top + items.length * rowH + bottom;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const measure = (txt, cls) => { const t = svg.append('text').attr('class', cls).text(txt); const w = t.node().getComputedTextLength(); t.remove(); return w; };
    const left = Math.min(W * 0.4, Math.max(...items.map((r) => measure(r.label)))) + 12;
    const right = Math.max(...items.map((r) => measure(r.valueText, 'ky-strong'))) + 12;
    const maxV = opts.max ?? Math.max(1, ...items.map((r) => r.parts.reduce((s, p) => s + Math.max(0, p.v), 0)));
    const x = d3.scaleLinear([0, maxV], [left, W - right]);
    const ticks = opts.ticks ?? x.ticks(W < 520 ? 3 : 5);
    svg.append('g').selectAll('line').data(ticks).join('line').attr('x1', x).attr('x2', x).attr('y1', top).attr('y2', H - bottom).attr('stroke', 'var(--cds-chart-grid)');
    svg.append('g').selectAll('text').data(ticks).join('text').attr('class', 'ky-tick').attr('x', x).attr('y', H - 8).attr('text-anchor', 'middle').text(opts.tickFmt ?? bahtShort);
    const t = tip(box);
    const g = svg.append('g').selectAll('g').data(items).join('g').attr('transform', (_, i) => `translate(0,${top + i * rowH})`);
    g.append('text').attr('x', left - 10).attr('y', rowH / 2).attr('dy', '0.35em').attr('text-anchor', 'end').text((r) => r.label);
    g.each(function (r) {
      let acc = 0;
      r.parts.forEach((p) => {
        const v = Math.max(0, p.v);
        d3.select(this).append('rect').attr('x', x(acc)).attr('y', (rowH - barH) / 2).attr('height', barH)
          .attr('width', Math.max(v > 0 ? 1 : 0, x(acc + v) - x(acc))).attr('fill', p.color);
        acc += v;
      });
      d3.select(this).append('text').attr('class', r.bad ? 'ky-strong ky-below' : 'ky-strong').attr('x', x(acc) + 8).attr('y', rowH / 2).attr('dy', '0.35em').text(r.valueText);
    });
    g.append('rect').attr('x', 0).attr('width', W).attr('height', rowH).attr('fill', 'transparent')
      .on('mousemove', (ev, r) => t.show(ev, [r.label, ...(r.tip ?? r.parts.map((p) => `${p.name} ${baht(p.v)} บาท`))]))
      .on('mouseleave', () => t.hide());
    if (opts.ref != null) svg.append('line').attr('x1', x(opts.ref)).attr('x2', x(opts.ref)).attr('y1', top - 4).attr('y2', H - bottom)
      .attr('stroke', 'var(--cds-chart-reference)').attr('stroke-dasharray', '5 4').attr('stroke-width', 2);
  }

  function finTable(head, rows, numericFrom = 1) {
    const wrap = el('div', { class: 'ky-tablewrap' });
    const tb = el('table', { class: 'ky-table' });
    const tr = el('tr');
    head.forEach((h, i) => tr.append(el('th', i >= numericFrom ? { class: 'num' } : {}, h)));
    const thead = el('thead'); thead.append(tr);
    const tbody = el('tbody');
    rows.forEach((cells) => {
      const r = el('tr', cells.cls ? { class: cells.cls } : {});
      cells.forEach((c, i) => r.append(el('td', i >= numericFrom ? { class: 'num' } : {}, c)));
      tbody.append(r);
    });
    tb.append(thead, tbody);
    wrap.append(tb);
    return wrap;
  }

  function buildFinance(view) {
    const fin = finData();
    const out = [];
    if (!fin.months.length) {
      out.push(finEmpty('ยังไม่มีรายงานการเงิน', [
        'รพ.สต. กรอกแบบรายงานการเงิน (ไฟล์ Excel) เดือนละ 1 ไฟล์ แล้วส่งให้ผู้รับผิดชอบ',
        'เมื่อนำไฟล์เข้าระบบแล้ว ข้อมูลการเคลมและยอดเงินคงเหลือของแต่ละ รพ.สต. จะแสดงที่หน้านี้',
      ]));
      return { nodes: out, draw: () => {} };
    }
    fin.months.forEach((m) => { m.month_year = String(m.fy - (['ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'].includes(m.month) ? 1 : 0)); });
    if (!fin.months.some((m) => m.ym === finMonth)) finMonth = fin.months[fin.months.length - 1].ym;
    const m = fin.months.find((x) => x.ym === finMonth);
    // each page counts only the units that filled that part of the form (a unit may report balances but not claims yet)
    const hasClaim = (u) => u.claim.sent.amt || u.claim.paid.amt || u.claim.sent.n || u.claim.paid.n;
    const hasBal = (u) => u.bal.uc || u.bal.bamrung || u.bal.cash || u.bal.debt;
    const partName = view === '__fin_claim' ? 'ข้อมูลการเคลม' : 'ยอดเงินคงเหลือ';
    const units = m.units.filter(view === '__fin_claim' ? hasClaim : hasBal);
    const missing = fin.all_units.filter((u) => !units.some((x) => x.code === u.code));
    const head = el('section', { class: 'ky-sec' });
    const note = el('div', { class: 'ky-note' });
    note.append(`เดือน${m.month} ${m.month_year} · ปีงบประมาณ ${m.fy} · ส่ง${partName}แล้ว ${units.length} / ${fin.all_units.length} แห่ง`);
    if (missing.length) note.append(el('span', { class: 'ky-old' }, `ยังไม่ส่ง: ${missing.map((u) => u.name.replace('รพ.สต.', '')).join(', ')}`));
    head.append(monthChips(fin), note);
    out.push(head);
    if (!units.length) {
      out.push(finEmpty(`ยังไม่มี${partName}เดือน${m.month} ${m.month_year}`, [`เมื่อกรอก${partName}ในไฟล์รายงานการเงินและนำเข้าระบบแล้ว จะแสดงที่หน้านี้`]));
      const yr = finYear(fin, view, m.fy);
      out.push(yr.node);
      return { nodes: out, draw: yr.draw };
    }
    const draws = [];
    const sum = (f) => units.reduce((s, u) => s + f(u), 0);
    const big = (a, b) => { const d = el('div', { class: 'big' }); d.append(a, el('small', {}, b)); return d; };

    if (view === '__fin_claim') {
      const sent = sum((u) => u.claim.sent.amt), paid = sum((u) => u.claim.paid.amt);
      const sentN = sum((u) => u.claim.sent.n), paidN = sum((u) => u.claim.paid.n), zeroN = sum((u) => u.claim.zero.n);
      const rate = sent ? (paid * 100) / sent : 0;
      const tiles = el('div', { class: 'ky-tiles' });
      tiles.append(
        tile('ky-t1', ICONS.fin, 'ส่งเบิกรวม', big(bahtShort(sent), ' บาท'), `${baht(sentN)} คน`),
        tile('ky-t2', ICONS.check, 'ได้รับเงินชดเชย', big(bahtShort(paid), ' บาท'), `${baht(paidN)} คน · ${f2(rate)}% ของยอดส่งเบิก`),
        tile('ky-t3', ICONS.pin, 'ไม่ได้รับ / ถูกลดยอด', big(bahtShort(sent - paid), ' บาท'), `ไม่ได้รับเงิน ${baht(zeroN)} คน`),
        tile('ky-t4', ICONS.people, 'ส่งรายงานแล้ว', big(`${units.length} / ${fin.all_units.length}`, ' แห่ง'), missing.length ? `ยังไม่ส่ง ${missing.length} แห่ง` : 'ครบทุกแห่ง'),
      );
      head.append(tiles);

      const sec = el('section', { class: 'ky-sec' });
      const row = el('div', { class: 'ky-row ky-row-2' });
      const c1 = el('div', { class: 'ky-card' });
      c1.append(el('h3', {}, 'ร้อยละเงินที่ได้รับเทียบยอดส่งเบิก'), el('div', { class: 'ky-note' }, 'เส้นประ = ภาพรวมอำเภอ · ชี้ที่แถบเพื่อดูจำนวนเงิน'));
      const b1 = el('div', { class: 'ky-chart ky-chart-fin' }); c1.append(b1);
      const c2 = el('div', { class: 'ky-card' });
      c2.append(el('h3', {}, 'เงินที่ได้รับ แยกตามประเภทบริการ'));
      const lg = el('div', { class: 'ky-legend' });
      FIN_TYPES.forEach(([, name], i) => lg.append(swatch(seriesColor(i, 4), name)));
      const b2 = el('div', { class: 'ky-chart ky-chart-fin' }); c2.append(lg, b2);
      row.append(c1, c2);
      sec.append(row);
      const items1 = units.map((u) => {
        const p = u.claim.sent.amt ? (u.claim.paid.amt * 100) / u.claim.sent.amt : 0;
        return { label: u.name, parts: [{ v: p, color: PAL.pass, name: 'ร้อยละ' }], valueText: f2(p) + '%',
          tip: [`ได้รับ ${f2(p)}%`, `ส่งเบิก ${baht(u.claim.sent.amt)} บาท`, `ได้รับ ${baht(u.claim.paid.amt)} บาท`] };
      }).sort((a, b) => b.parts[0].v - a.parts[0].v);
      const items2 = units.map((u) => ({ label: u.name, valueText: baht(u.claim.paid.amt),
        parts: FIN_TYPES.map(([k, name], i) => ({ v: u.bytype[k].amt, color: seriesColor(i, 4), name: k === 'other' && u.bytype.other.label ? `อื่น ๆ (${u.bytype.other.label})` : name })) }))
        .sort((a, b) => b.parts.reduce((s, p) => s + p.v, 0) - a.parts.reduce((s, p) => s + p.v, 0));
      draws.push(() => drawStack(b1, items1, { max: 100, ticks: [0, 25, 50, 75, 100], tickFmt: (v) => v + '%', ref: rate }));
      draws.push(() => drawStack(b2, items2));

      const reasons = new Map();
      units.forEach((u) => u.denied.forEach((d) => {
        const r = reasons.get(d.reason) ?? { n: 0, amt: 0, units: new Set(), fix: {} };
        r.n += d.n; r.amt += d.amt; r.units.add(u.name.replace('รพ.สต.', ''));
        if (d.fix) r.fix[d.fix] = (r.fix[d.fix] ?? 0) + 1;
        reasons.set(d.reason, r);
      }));
      const c3 = el('div', { class: 'ky-card' });
      c3.append(el('h3', {}, 'รายการที่ไม่ได้รับเงิน / ถูกลดยอด แยกตามสาเหตุ'));
      const rs = [...reasons.entries()].sort((a, b) => b[1].amt - a[1].amt);
      c3.append(rs.length ? finTable(['สาเหตุ', 'ครั้ง', 'บาท', 'การแก้ไข', 'รพ.สต.'],
        rs.map(([reason, r]) => [reason, baht(r.n), baht(r.amt), Object.entries(r.fix).map(([k, v]) => `${k} ${v}`).join(' · ') || '—', [...r.units].join(', ')]), 1)
        : el('p', { class: 'ky-note' }, 'ไม่มีรายการที่ไม่ได้รับเงินในเดือนนี้'));
      c3.querySelectorAll('td:nth-child(4), td:nth-child(5), th:nth-child(4), th:nth-child(5)').forEach((x) => x.classList.remove('num'));
      sec.append(c3);
      out.push(sec);
    } else {
      const tot = (u) => u.bal.uc + u.bal.bamrung + u.bal.cash;
      const all = sum(tot), net = sum((u) => tot(u) - u.bal.debt);
      const tiles = el('div', { class: 'ky-tiles' });
      tiles.append(
        tile('ky-t1', ICONS.fin, 'เงินคงเหลือรวมทุก รพ.สต.', big(bahtShort(all), ' บาท'), `UC + บำรุง + เงินสด · ${units.length} แห่ง`),
        tile('ky-t2', ICONS.map, 'บัญชีเงิน UC', big(bahtShort(sum((u) => u.bal.uc)), ' บาท'), 'รวมทุก รพ.สต.'),
        tile('ky-t3', ICONS.pin, 'บัญชีเงินบำรุง', big(bahtShort(sum((u) => u.bal.bamrung)), ' บาท'), 'รวมทุก รพ.สต.'),
        tile('ky-t4', ICONS.check, 'เงินคงเหลือสุทธิ', big(bahtShort(net), ' บาท'), `หลังหักหนี้สิน ${bahtShort(sum((u) => u.bal.debt))} บาท`),
      );
      if (net < 0) tiles.lastChild.classList.add('ky-miss');
      head.append(tiles);
      const sec = el('section', { class: 'ky-sec' });
      const c1 = el('div', { class: 'ky-card' });
      c1.append(el('h3', {}, 'เงินคงเหลือราย รพ.สต.'), el('div', { class: 'ky-note' }, 'ตัวเลขท้ายแถบ = เงินคงเหลือสุทธิหลังหักหนี้สิน (สีแดง = ติดลบ)'));
      const lg = el('div', { class: 'ky-legend' });
      BAL_PARTS.forEach(([, name], i) => lg.append(swatch(seriesColor(i, 3), name)));
      const b1 = el('div', { class: 'ky-chart ky-chart-fin' }); c1.append(lg, b1);
      const items = units.map((u) => {
        const n = tot(u) - u.bal.debt;
        return { label: u.name, valueText: `สุทธิ ${baht(n)}`, bad: n < 0, parts: BAL_PARTS.map(([k, name], i) => ({ v: u.bal[k], color: seriesColor(i, 3), name })),
          tip: [...BAL_PARTS.map(([k, name]) => `${name} ${baht(u.bal[k])} บาท`), `หนี้สิน/ค้างจ่าย ${baht(u.bal.debt)} บาท`, `สุทธิ ${baht(n)} บาท`, `ณ วันที่ ${u.asof || '—'}`] };
      }).sort((a, b) => b.parts.reduce((s, p) => s + p.v, 0) - a.parts.reduce((s, p) => s + p.v, 0));
      draws.push(() => drawStack(b1, items));
      const c2 = el('div', { class: 'ky-card' });
      c2.append(el('h3', {}, 'รายละเอียดเงินคงเหลือ (บาท)'));
      const rows = units.map((u) => {
        const n = tot(u) - u.bal.debt;
        const notes = Object.entries(u.bal.notes || {}).filter(([, v]) => v).map(([, v]) => v).join(' · ');
        const r = [u.name, baht(u.bal.uc), baht(u.bal.bamrung), baht(u.bal.cash), baht(tot(u)), baht(u.bal.debt), baht(n), u.asof || '—', notes || '—'];
        if (n < 0) r.cls = 'ky-neg';
        return r;
      });
      const total = ['รวม', baht(sum((u) => u.bal.uc)), baht(sum((u) => u.bal.bamrung)), baht(sum((u) => u.bal.cash)), baht(all), baht(sum((u) => u.bal.debt)), baht(net), '', ''];
      total.cls = 'ky-total';
      const tb = finTable(['รพ.สต.', 'UC', 'บำรุง', 'เงินสด', 'รวม', 'หนี้สิน', 'สุทธิ', 'ณ วันที่', 'หมายเหตุ'], [...rows, total], 1);
      tb.querySelectorAll('td:nth-child(8), td:nth-child(9), th:nth-child(8), th:nth-child(9)').forEach((x) => x.classList.remove('num'));
      c2.append(tb);
      sec.append(c1, c2);
      out.push(sec);
    }
    const yr = finYear(fin, view, m.fy);
    out.push(yr.node);
    draws.push(yr.draw);
    return { nodes: out, draw: () => draws.forEach((d) => d()) };
  }

  // ----- whole fiscal year: monthly trend + table per รพ.สต. -----
  const FY_MONTHS = ['ตุลาคม', 'พฤศจิกายน', 'ธันวาคม', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน'];
  const FY_SHORT = ['ต.ค.', 'พ.ย.', 'ธ.ค.', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.'];
  const finHasClaim = (u) => u.claim.sent.amt || u.claim.paid.amt || u.claim.sent.n || u.claim.paid.n;
  const finHasBal = (u) => u.bal.uc || u.bal.bamrung || u.bal.cash || u.bal.debt;
  const finNet = (u) => u.bal.uc + u.bal.bamrung + u.bal.cash - u.bal.debt;

  // vertical bars per month. series: [{name, color, values: [12 numbers|null]}]; mode 'group' or 'stack'
  function drawMonthBars(box, cats, series, opts = {}) {
    box.querySelector('svg')?.remove();
    const W = box.clientWidth, H = 260, top = 22, bottom = 30;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const stack = opts.mode === 'stack';
    const totals = cats.map((_, i) => (stack ? series.reduce((s, se) => s + Math.max(0, se.values[i] ?? 0), 0) : Math.max(0, ...series.map((se) => se.values[i] ?? 0))));
    const maxV = Math.max(1, ...totals);
    const y0 = d3.scaleLinear([0, maxV], [H - bottom, top]).nice();
    const ticks = y0.ticks(4);
    const measure = (txt) => { const t = svg.append('text').attr('class', 'ky-tick').text(txt); const w = t.node().getComputedTextLength(); t.remove(); return w; };
    const left = Math.max(...ticks.map((v) => measure(bahtShort(v)))) + 10;
    const x = d3.scaleBand(cats, [left, W - 6]).padding(0.25);
    svg.append('g').selectAll('line').data(ticks).join('line').attr('x1', left).attr('x2', W - 6).attr('y1', y0).attr('y2', y0).attr('stroke', 'var(--cds-chart-grid)');
    svg.append('g').selectAll('text').data(ticks).join('text').attr('class', 'ky-tick').attr('x', left - 6).attr('y', y0).attr('dy', '0.35em').attr('text-anchor', 'end').text(bahtShort);
    svg.append('g').selectAll('text').data(cats).join('text').attr('class', 'ky-tick').attr('x', (c) => x(c) + x.bandwidth() / 2).attr('y', H - 8).attr('text-anchor', 'middle').text((c) => c);
    const t = tip(box);
    cats.forEach((c, i) => {
      const has = series.some((se) => se.values[i] != null);
      const g = svg.append('g');
      if (has) {
        if (stack) {
          let acc = 0;
          series.forEach((se) => {
            const v = Math.max(0, se.values[i] ?? 0);
            g.append('rect').attr('x', x(c)).attr('width', x.bandwidth()).attr('y', y0(acc + v)).attr('height', Math.max(0, y0(acc) - y0(acc + v))).attr('fill', se.color);
            acc += v;
          });
        } else {
          const sub = d3.scaleBand(series.map((s) => s.name), [0, x.bandwidth()]).padding(0.08);
          series.forEach((se) => {
            const v = Math.max(0, se.values[i] ?? 0);
            g.append('rect').attr('x', x(c) + sub(se.name)).attr('width', sub.bandwidth()).attr('y', y0(v)).attr('height', Math.max(0, y0(0) - y0(v))).attr('rx', 3).attr('fill', se.color);
          });
        }
        const lab = opts.label?.(i);
        if (lab) g.append('text').attr('class', opts.bad?.(i) ? 'ky-strong ky-below' : 'ky-strong').style('font-size', 'var(--cds-font-size-caption)')
          .attr('x', x(c) + x.bandwidth() / 2).attr('y', y0(totals[i]) - 6).attr('text-anchor', 'middle').text(lab);
      } else {
        g.append('text').attr('class', 'ky-tick').attr('x', x(c) + x.bandwidth() / 2).attr('y', y0(0) - 6).attr('text-anchor', 'middle').text('–');
      }
      g.append('rect').attr('x', x(c)).attr('width', x.bandwidth()).attr('y', top).attr('height', H - top - bottom).attr('fill', 'transparent')
        .on('mousemove', (ev) => t.show(ev, has ? [opts.tipTitle?.(i) ?? c, ...series.map((se) => `${se.name} ${baht(se.values[i] ?? 0)} บาท`), ...(opts.tipExtra?.(i) ?? [])] : [c, 'ยังไม่มีข้อมูล']))
        .on('mouseleave', () => t.hide());
    });
  }

  function finYear(fin, view, fy) {
    const isClaim = view === '__fin_claim';
    const has = isClaim ? finHasClaim : finHasBal;
    const byMonth = FY_MONTHS.map((name) => fin.months.find((m) => m.fy === fy && m.month === name) || null);
    const unitsOf = (m) => (m ? m.units.filter(has) : []);
    const yy = (i) => String((i < 3 ? fy - 1 : fy) % 100).padStart(2, '0');
    const cats = FY_SHORT.map((s, i) => `${s}${yy(i)}`);
    const sec = el('section', { class: 'ky-sec', id: isClaim ? 'fin-year-claim' : 'fin-year-bal' });
    sec.append(el('h2', {}, `ภาพรวมทั้งปีงบประมาณ ${fy}`));
    const c1 = el('div', { class: 'ky-card' });
    const box = el('div', { class: 'ky-chart ky-chart-fin' });
    let draw;
    if (isClaim) {
      const sent = byMonth.map((m) => (unitsOf(m).length ? unitsOf(m).reduce((s, u) => s + u.claim.sent.amt, 0) : null));
      const paid = byMonth.map((m) => (unitsOf(m).length ? unitsOf(m).reduce((s, u) => s + u.claim.paid.amt, 0) : null));
      c1.append(el('h3', {}, 'แนวโน้มรายเดือน: ส่งเบิก และเงินที่ได้รับ'), el('div', { class: 'ky-note' }, 'รวมทุก รพ.สต. ที่ส่งข้อมูลเดือนนั้น · ตัวเลขบนแท่ง = ร้อยละที่ได้รับ'));
      const lg = el('div', { class: 'ky-legend' });
      lg.append(swatch(seriesColor(1, 2), 'ส่งเบิก'), swatch(seriesColor(0, 2), 'ได้รับเงินชดเชย'));
      c1.append(lg, box);
      draw = () => drawMonthBars(box, cats, [{ name: 'ส่งเบิก', color: seriesColor(1, 2), values: sent }, { name: 'ได้รับ', color: seriesColor(0, 2), values: paid }], {
        label: (i) => (sent[i] ? `${f2((paid[i] * 100) / sent[i])}%` : null),
        tipTitle: (i) => FY_MONTHS[i] + ' ' + (i < 3 ? fy - 1 : fy),
        tipExtra: (i) => [`ส่งข้อมูล ${unitsOf(byMonth[i]).length} แห่ง`],
      });
    } else {
      const part = (k) => byMonth.map((m) => (unitsOf(m).length ? unitsOf(m).reduce((s, u) => s + u.bal[k], 0) : null));
      const debt = part('debt');
      const net = byMonth.map((m) => (unitsOf(m).length ? unitsOf(m).reduce((s, u) => s + finNet(u), 0) : null));
      c1.append(el('h3', {}, 'แนวโน้มรายเดือน: เงินคงเหลือรวม'), el('div', { class: 'ky-note' }, 'รวมทุก รพ.สต. ที่ส่งข้อมูลเดือนนั้น · ตัวเลขบนแท่ง = เงินคงเหลือสุทธิหลังหักหนี้สิน'));
      const lg = el('div', { class: 'ky-legend' });
      BAL_PARTS.forEach(([, name], i) => lg.append(swatch(seriesColor(i, 3), name)));
      c1.append(lg, box);
      draw = () => drawMonthBars(box, cats, BAL_PARTS.map(([k, name], i) => ({ name, color: seriesColor(i, 3), values: part(k) })), {
        mode: 'stack',
        label: (i) => (net[i] != null ? bahtShort(net[i]) : null),
        bad: (i) => net[i] < 0,
        tipTitle: (i) => FY_MONTHS[i] + ' ' + (i < 3 ? fy - 1 : fy),
        tipExtra: (i) => [`หนี้สิน/ค้างจ่าย ${baht(debt[i] ?? 0)} บาท`, `สุทธิ ${baht(net[i] ?? 0)} บาท`, `ส่งข้อมูล ${unitsOf(byMonth[i]).length} แห่ง`],
      });
    }
    const c2 = el('div', { class: 'ky-card' });
    c2.append(el('h3', {}, isClaim ? 'เงินที่ได้รับ ราย รพ.สต. รายเดือน (บาท)' : 'เงินคงเหลือสุทธิ ราย รพ.สต. รายเดือน (บาท)'),
      el('div', { class: 'ky-note' }, isClaim ? '· = ยังไม่ส่ง · ชี้ที่ตัวเลขเพื่อดูยอดส่งเบิกและร้อยละ' : '· = ยังไม่ส่ง · สีแดง = ติดลบ'));
    const head = ['รพ.สต.', ...cats, isClaim ? 'รวมทั้งปี' : 'ล่าสุด'];
    const wrap = el('div', { class: 'ky-tablewrap' });
    const tb = el('table', { class: 'ky-table ky-fin-year' });
    const hr = el('tr');
    head.forEach((h, i) => hr.append(el('th', i ? { class: 'num' } : {}, h)));
    const thead = el('thead'); thead.append(hr);
    const tbody = el('tbody');
    const colTot = Array(12).fill(null);
    let grand = 0;
    fin.all_units.forEach((au) => {
      const r = el('tr');
      r.append(el('td', {}, au.name.replace('รพ.สต.', '')));
      let rowTot = 0, last = null, any = false;
      byMonth.forEach((m, i) => {
        const u = m && m.units.find((x) => x.code === au.code && has(x));
        if (!u) { r.append(el('td', { class: 'num ky-muted-cell' }, '·')); return; }
        any = true;
        const v = isClaim ? u.claim.paid.amt : finNet(u);
        const pct = isClaim && u.claim.sent.amt ? ` (${f2((u.claim.paid.amt * 100) / u.claim.sent.amt)}%)` : '';
        const td = el('td', { class: 'num' + (!isClaim && v < 0 ? ' ky-neg-cell' : ''), title: isClaim ? `ส่งเบิก ${baht(u.claim.sent.amt)} · ได้รับ ${baht(v)}${pct}` : `ณ ${u.asof || '—'}` }, baht(v));
        r.append(td);
        colTot[i] = (colTot[i] ?? 0) + v;
        rowTot += v;
        last = v;
      });
      const endVal = isClaim ? (any ? rowTot : null) : last;
      if (endVal != null) grand += endVal;
      r.append(el('td', { class: 'num ky-strong-cell' + (!isClaim && endVal < 0 ? ' ky-neg-cell' : '') }, endVal == null ? '·' : baht(endVal)));
      tbody.append(r);
    });
    const tr = el('tr', { class: 'ky-total' });
    tr.append(el('td', {}, 'รวม'));
    colTot.forEach((v) => tr.append(el('td', { class: 'num' }, v == null ? '·' : baht(v))));
    tr.append(el('td', { class: 'num' }, baht(grand)));
    tbody.append(tr);
    tb.append(thead, tbody);
    wrap.append(tb);
    c2.append(wrap);
    sec.append(c1, c2);
    return { node: sec, draw };
  }

  cardsEl.addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-fin-month]');
    if (b) { finMonth = b.dataset.finMonth; dash.setParams({ fm: finMonth }); }
  });

  // ===== PA ปี 2570 (data: data/pa.json = agreement from 'PA 70.xlsx' + scores from pa/คะแนน_PA70.xlsx) =====
  const PA_GROUP = 'PA ปี 2570';
  const PA_KPIS = [{ kpi: '__pa_score', kpi_name: 'คะแนนราย รพ.สต.' }, { kpi: '__pa_unit', kpi_name: 'ความก้าวหน้าราย รพ.สต.' },
    { kpi: '__pa_criteria', kpi_name: 'ตัวชี้วัดและเกณฑ์' }];
  let paUnit = null;
  ICONS.pa = ['M8 4h8v3H8z', 'M6 5H5v16h14V5h-1', 'M9 12l2 2 4-4', 'M9 17h6'];
  const paData = () => {
    if (dash.pa) return dash.pa;
    const d = dash.data && dash.data('pa');
    return d && d.status === 'ok' && d.data && !Array.isArray(d.data) ? d.data : { indicators: [], areas: [], units: [], scores: {}, results: {} };
  };
  const paTotal = (pa, code) => {
    const s = pa.scores[code] || {};
    const done = pa.indicators.filter((i) => s[i.id] != null);
    return { score: done.reduce((t, i) => t + (i.weight * s[i.id]) / 5, 0), done: done.length, n: pa.indicators.length };
  };
  const scoreClass = (s) => (s == null ? 'na' : s <= 2 ? 'low' : `s${Math.round(s)}`);

  function buildPA(view) {
    const pa = paData();
    const out = [];
    if (!pa.indicators.length) {
      out.push(finEmpty('ยังไม่มีข้อมูล PA', ['ยังไม่ได้นำเข้าคำรับรองการปฏิบัติราชการ (PA 70.xlsx)']));
      return { nodes: out, draw: () => {} };
    }
    const head = el('section', { class: 'ky-sec' });
    head.append(el('div', { class: 'ky-note' }, `${pa.title} · ${pa.period}`));
    out.push(head);
    const big = (a, b) => { const d = el('div', { class: 'big' }); d.append(a, el('small', {}, b)); return d; };

    if (view === '__pa_criteria') {
      const card = el('div', { class: 'ky-card' });
      card.append(el('h3', {}, `ตัวชี้วัด ${pa.indicators.length} ตัว · น้ำหนักรวม ${pa.total_weight}`));
      const wrap = el('div', { class: 'ky-tablewrap' });
      const tb = el('table', { class: 'ky-table ky-pa-crit' });
      const hr = el('tr');
      ['ข้อ', 'ตัวชี้วัด', 'น้ำหนัก', 'ค่าเป้าหมาย', '1', '2', '3', '4', '5', 'แล้วเสร็จ'].forEach((h, i) => hr.append(el('th', i >= 2 ? { class: 'c' } : {}, h)));
      const thead = el('thead'); thead.append(hr);
      const tbody = el('tbody');
      pa.areas.forEach((a) => {
        const inds = pa.indicators.filter((i) => i.area === a.id);
        if (!(inds.length === 1 && inds[0].id === a.id)) {
          const ar = el('tr', { class: 'ky-area' });
          ar.append(el('td', {}, a.id), el('td', { colspan: '9' }, `${a.name} (น้ำหนักรวม ${a.weight})`));
          tbody.append(ar);
        }
        inds.forEach((i) => {
          const r = el('tr');
          r.append(el('td', {}, i.id), el('td', {}, i.name), el('td', { class: 'c' }, String(i.weight)), el('td', { class: 'c' }, i.target || '—'));
          i.criteria.forEach((c) => r.append(el('td', { class: 'c' }, c || '—')));
          r.append(el('td', { class: 'c' }, i.deadline || '—'));
          tbody.append(r);
        });
      });
      tb.append(thead, tbody);
      wrap.append(tb);
      card.append(wrap);
      out.push(card);
      return { nodes: out, draw: () => {} };
    }

    if (view === '__pa_unit') return buildPAUnit(pa, out, head, big);

    // score view
    const totals = pa.units.map((u) => ({ ...u, ...paTotal(pa, u.code) }));
    const scored = totals.filter((t) => t.done > 0);
    const complete = totals.filter((t) => t.done === t.n);
    if (!scored.length) {
      out.push(finEmpty('ยังไม่มีคะแนน PA', [
        `กรอกคะแนน 1–5 ของแต่ละ รพ.สต. ในไฟล์ pa\\คะแนน_PA70.xlsx (ชีท "คะแนน") แล้วนำเข้าระบบ`,
        'ดูตัวชี้วัดและเกณฑ์การให้คะแนนได้ที่เมนู "ตัวชี้วัดและเกณฑ์"',
      ]));
      return { nodes: out, draw: () => {} };
    }
    const avg = scored.reduce((s, t) => s + t.score, 0) / scored.length;
    const best = [...scored].sort((a, b) => b.score - a.score)[0];
    const worst = [...scored].sort((a, b) => a.score - b.score)[0];
    const tiles = el('div', { class: 'ky-tiles' });
    tiles.append(
      tile('ky-t1', ICONS.pa, 'คะแนนเฉลี่ยอำเภอ', big(f2(avg), ' / 100'), `จาก ${scored.length} แห่งที่มีคะแนน`),
      tile('ky-t2', ICONS.star, 'คะแนนสูงสุด', big(f2(best.score), ''), best.name),
      tile('ky-t3', ICONS.pin, 'คะแนนต่ำสุด', big(f2(worst.score), ''), worst.name),
      tile('ky-t4', ICONS.check, 'ประเมินครบทุกตัวชี้วัด', big(`${complete.length} / ${pa.units.length}`, ' แห่ง'), `ครบ ${pa.indicators.length} ตัวชี้วัด`),
    );
    head.append(tiles);

    const sec = el('section', { class: 'ky-sec' });
    const c1 = el('div', { class: 'ky-card' });
    c1.append(el('h3', {}, 'คะแนน PA รวม ราย รพ.สต. (เต็ม 100)'), el('div', { class: 'ky-note' }, 'คะแนนรวม = Σ(น้ำหนัก × คะแนน) ÷ 5 · เส้นประ = ค่าเฉลี่ยอำเภอ · ในวงเล็บ = จำนวนตัวชี้วัดที่ประเมินแล้ว'));
    const b1 = el('div', { class: 'ky-chart ky-chart-fin' });
    c1.append(b1);
    const items = totals.map((t) => ({
      label: t.name,
      parts: [{ v: t.score, color: PAL.pass, name: 'คะแนน' }],
      valueText: t.done ? `${f2(t.score)}${t.done < t.n ? ` (${t.done}/${t.n})` : ''}` : 'ยังไม่ประเมิน',
      tip: t.done ? [`คะแนนรวม ${f2(t.score)} / 100`, `ประเมินแล้ว ${t.done} จาก ${t.n} ตัวชี้วัด`] : ['ยังไม่ประเมิน'],
    })).sort((a, b) => b.parts[0].v - a.parts[0].v);

    const c2 = el('div', { class: 'ky-card' });
    c2.append(el('h3', {}, 'คะแนนรายตัวชี้วัด (1–5)'));
    const lg = el('div', { class: 'ky-legend' });
    [['s5', '5'], ['s4', '4'], ['s3', '3'], ['low', '1–2'], ['na', 'ยังไม่ประเมิน']].forEach(([k, t]) => {
      const s = el('span'); s.append(el('i', { class: `ky-sw ky-heat-${k}` }), t); lg.append(s);
    });
    c2.append(lg);
    const wrap = el('div', { class: 'ky-tablewrap' });
    const tb = el('table', { class: 'ky-table ky-heat' });
    const hr = el('tr');
    hr.append(el('th', {}, 'ข้อ'), el('th', {}, 'ตัวชี้วัด'), el('th', { class: 'c' }, 'น้ำหนัก'));
    pa.units.forEach((u) => hr.append(el('th', { class: 'c' }, u.name.replace('รพ.สต.', ''))));
    const thead = el('thead'); thead.append(hr);
    const tbody = el('tbody');
    pa.areas.forEach((a) => {
      const inds = pa.indicators.filter((i) => i.area === a.id);
      if (!(inds.length === 1 && inds[0].id === a.id)) {
        const ar = el('tr', { class: 'ky-area' });
        ar.append(el('td', {}, a.id), el('td', { colspan: String(2 + pa.units.length) }, `${a.name} (น้ำหนักรวม ${a.weight})`));
        tbody.append(ar);
      }
      inds.forEach((i) => {
        const r = el('tr');
        r.append(el('td', {}, i.id), el('td', { class: 'ky-heat-name' }, i.name), el('td', { class: 'c' }, String(i.weight)));
        pa.units.forEach((u) => {
          const s = (pa.scores[u.code] || {})[i.id];
          const res = (pa.results[u.code] || {})[i.id];
          const td = el('td', { class: `c ky-heat-${scoreClass(s)}`, title: `${u.name} · ${i.id}${res ? ` · ผลงาน: ${res}` : ''}` }, s == null ? '·' : String(s));
          r.append(td);
        });
        tbody.append(r);
      });
    });
    const tr = el('tr', { class: 'ky-total' });
    tr.append(el('td', {}, ''), el('td', {}, 'คะแนนรวม (เต็ม 100)'), el('td', { class: 'c' }, String(pa.total_weight)));
    totals.forEach((t) => tr.append(el('td', { class: 'c' }, t.done ? f2(t.score) : '—')));
    tbody.append(tr);
    tb.append(thead, tbody);
    wrap.append(tb);
    c2.append(wrap);
    sec.append(c1, c2);
    out.push(sec);
    return { nodes: out, draw: () => drawStack(b1, items, { max: 100, ticks: [0, 25, 50, 75, 100], tickFmt: (v) => String(v), ref: avg }) };
  }

  // line of total score over import dates (pa.history)
  function drawPALine(box, pts, ref) {
    box.querySelector('svg')?.remove();
    const W = box.clientWidth, H = 220, top = 22, bottom = 30, left = 34, right = 16;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const x = d3.scalePoint(pts.map((p) => p.label), [left + 10, W - right - 10]);
    const y = d3.scaleLinear([0, 100], [H - bottom, top]);
    [0, 25, 50, 75, 100].forEach((v) => {
      svg.append('line').attr('x1', left).attr('x2', W - right).attr('y1', y(v)).attr('y2', y(v)).attr('stroke', 'var(--cds-chart-grid)');
      svg.append('text').attr('class', 'ky-tick').attr('x', left - 6).attr('y', y(v)).attr('dy', '0.35em').attr('text-anchor', 'end').text(v);
    });
    pts.forEach((p) => svg.append('text').attr('class', 'ky-tick').attr('x', x(p.label)).attr('y', H - 8).attr('text-anchor', 'middle').text(p.label));
    if (ref != null) svg.append('line').attr('x1', left).attr('x2', W - right).attr('y1', y(ref)).attr('y2', y(ref)).attr('stroke', 'var(--cds-chart-reference)').attr('stroke-dasharray', '5 4');
    svg.append('path').attr('d', d3.line().x((p) => x(p.label)).y((p) => y(p.v))(pts)).attr('fill', 'none').attr('stroke', tint(85)).attr('stroke-width', 2.5).attr('stroke-linejoin', 'round').attr('stroke-linecap', 'round');
    pts.forEach((p) => {
      svg.append('circle').attr('cx', x(p.label)).attr('cy', y(p.v)).attr('r', 4).attr('fill', tint(85));
      svg.append('text').attr('class', 'ky-strong').style('font-size', 'var(--cds-font-size-caption)').attr('x', x(p.label)).attr('y', y(p.v) - 9).attr('text-anchor', 'middle').text(f2(p.v));
    });
  }

  function buildPAUnit(pa, out, head, big) {
    const totals = pa.units.map((u) => ({ ...u, ...paTotal(pa, u.code) }));
    const scored = totals.filter((t) => t.done > 0);
    if (!pa.units.some((u) => u.code === paUnit)) paUnit = (scored[0] || pa.units[0]).code;
    const chips = el('div', { class: 'ky-chips', role: 'group', 'aria-label': 'รพ.สต.' });
    pa.units.forEach((u) => chips.append(el('button', { type: 'button', class: 'ky-chip', 'data-pa-unit': u.code, 'aria-pressed': String(u.code === paUnit) }, u.name.replace('รพ.สต.', ''))));
    head.append(chips);
    const me = totals.find((t) => t.code === paUnit);
    const s = pa.scores[paUnit] || {};
    if (!me.done) {
      out.push(finEmpty(`${me.name} ยังไม่มีคะแนน PA`, ['เมื่อกรอกคะแนนในไฟล์ pa\\คะแนน_PA70.xlsx และนำเข้าระบบแล้ว ความก้าวหน้าจะแสดงที่หน้านี้']));
      return { nodes: out, draw: () => {} };
    }
    const avg = scored.reduce((a, t) => a + t.score, 0) / scored.length;
    const rank = [...scored].sort((a, b) => b.score - a.score).findIndex((t) => t.code === paUnit) + 1;
    const lost = pa.indicators.filter((i) => s[i.id] != null).reduce((a, i) => a + (i.weight * (5 - s[i.id])) / 5, 0);
    const pending = pa.indicators.filter((i) => s[i.id] == null).reduce((a, i) => a + i.weight, 0);
    const tiles = el('div', { class: 'ky-tiles' });
    tiles.append(
      tile('ky-t1', ICONS.pa, `คะแนนรวม ${me.name.replace('รพ.สต.', '')}`, big(f2(me.score), ' / 100'), pending ? `ยังรอประเมินอีก ${pending} คะแนน` : 'ประเมินครบทุกตัวชี้วัด'),
      tile('ky-t2', ICONS.check, 'ความก้าวหน้าการประเมิน', big(`${me.done} / ${me.n}`, ' ตัวชี้วัด'), `${f2((me.done * 100) / me.n)}% ของตัวชี้วัดทั้งหมด`),
      tile('ky-t3', ICONS.star, 'อันดับในอำเภอ', big(`${rank} / ${scored.length}`, ''), `ค่าเฉลี่ยอำเภอ ${f2(avg)} (${me.score >= avg ? 'สูงกว่า' : 'ต่ำกว่า'} ${f2(Math.abs(me.score - avg))})`),
      tile('ky-t4', ICONS.pin, 'คะแนนที่ยังไม่ได้', big(f2(lost), ' คะแนน'), 'จากตัวชี้วัดที่ประเมินแล้วแต่ไม่ได้ 5'),
    );
    head.append(tiles);

    const LOST = 'color-mix(in srgb, var(--color-bad) 32%, var(--color-panel))';
    const sec = el('section', { class: 'ky-sec' });
    const c1 = el('div', { class: 'ky-card' });
    c1.append(el('h3', {}, 'คะแนนรายด้าน เทียบน้ำหนักเต็มของด้าน'));
    const lg1 = el('div', { class: 'ky-legend' });
    lg1.append(swatch(PAL.pass, 'ได้แล้ว'), swatch(LOST, 'ประเมินแล้วแต่ไม่ได้'), swatch('var(--cds-chart-grid)', 'ยังไม่ประเมิน'));
    const b1 = el('div', { class: 'ky-chart ky-chart-fin' });
    c1.append(lg1, b1);
    const areaItems = pa.areas.map((a) => {
      const inds = pa.indicators.filter((i) => i.area === a.id);
      const got = inds.filter((i) => s[i.id] != null).reduce((t, i) => t + (i.weight * s[i.id]) / 5, 0);
      const miss = inds.filter((i) => s[i.id] != null).reduce((t, i) => t + (i.weight * (5 - s[i.id])) / 5, 0);
      const pend = inds.filter((i) => s[i.id] == null).reduce((t, i) => t + i.weight, 0);
      return { label: `${a.id} ${a.name.length > 26 ? a.name.slice(0, 25) + '…' : a.name}`, valueText: `${f2(got)} / ${a.weight}`,
        parts: [{ v: got, color: PAL.pass, name: 'ได้แล้ว' }, { v: miss, color: LOST, name: 'ไม่ได้' }, { v: pend, color: 'var(--cds-chart-grid)', name: 'ยังไม่ประเมิน' }],
        tip: [`${a.id} ${a.name}`, `ได้ ${f2(got)} จาก ${a.weight} คะแนน`, `ประเมินแล้วแต่ไม่ได้ ${f2(miss)}`, `ยังไม่ประเมิน ${f2(pend)}`] };
    });

    const c2 = el('div', { class: 'ky-card' });
    c2.append(el('h3', {}, 'คะแนนรายตัวชี้วัด (เต็ม 5)'), el('div', { class: 'ky-note' }, 'สีแดง = ได้ 1–2 · ชี้ที่แถบเพื่อดูผลงานและเกณฑ์'));
    const b2 = el('div', { class: 'ky-chart ky-chart-fin' });
    c2.append(b2);
    const res = pa.results[paUnit] || {};
    const indItems = pa.indicators.map((i) => {
      const v = s[i.id];
      return { label: `${i.id} ${i.name.length > 30 ? i.name.slice(0, 29) + '…' : i.name}`, valueText: v == null ? 'ยังไม่ประเมิน' : `${v}`, bad: v != null && v <= 2,
        parts: [{ v: v ?? 0, color: v != null && v <= 2 ? PAL.bad : PAL.pass, name: 'คะแนน' }],
        tip: [`${i.id} ${i.name}`, v == null ? 'ยังไม่ประเมิน' : `คะแนน ${v} / 5 (น้ำหนัก ${i.weight} → ได้ ${f2((i.weight * v) / 5)})`, ...(res[i.id] ? [`ผลงาน: ${res[i.id]}`] : []),
          `เกณฑ์: ${i.criteria.map((c, k) => `${k + 1}=${c}`).join(' · ')}`] };
    });

    const c3 = el('div', { class: 'ky-card' });
    c3.append(el('h3', {}, 'ความก้าวหน้าคะแนนรวมตามวันที่อัปเดต'), el('div', { class: 'ky-note' }, 'บันทึกทุกครั้งที่นำเข้าคะแนนใหม่ · เส้นประ = ค่าเฉลี่ยอำเภอปัจจุบัน'));
    const b3 = el('div', { class: 'ky-chart ky-chart-fin' });
    const hist = (pa.history || []).filter((h) => (h.done[paUnit] || 0) > 0)
      .map((h) => ({ label: new Date(h.date + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }), v: h.totals[paUnit] }));
    if (hist.length >= 2) c3.append(b3);
    else c3.append(el('p', { class: 'ky-note' }, 'จะแสดงเส้นความก้าวหน้าเมื่อมีการอัปเดตคะแนนตั้งแต่ 2 ครั้งขึ้นไป'));

    sec.append(c1, c2, c3);
    out.push(sec);
    return { nodes: out, draw: () => {
      drawStack(b1, areaItems, { max: Math.max(...pa.areas.map((a) => a.weight)), tickFmt: (v) => String(v) });
      drawStack(b2, indItems, { max: 5, ticks: [0, 1, 2, 3, 4, 5], tickFmt: (v) => String(v) });
      if (hist.length >= 2) drawPALine(b3, hist, avg);
    } };
  }

  cardsEl.addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-pa-unit]');
    if (b) { paUnit = b.dataset.paUnit; dash.setParams({ pu: paUnit }); }
  });

  // ===== แบ่งงาน (data: data/assign.json from the district order docx; รพ.สต. people go in assign.rpst) =====
  // Two views of the same data: by unit (สสอ. or one รพ.สต.) and by job (who does this job in each unit).
  const AS_GROUP = 'แบ่งงาน';
  const AS_KPIS = [{ kpi: '__as_unit', kpi_name: 'แบ่งตามหน่วยงาน' }, { kpi: '__as_job', kpi_name: 'แบ่งตามงาน' }];
  ICONS.org = ['c:12,5,2.5', 'c:5,18,2.5', 'c:19,18,2.5', 'M12 7.5v4', 'M5 15.5v-2h14v2', 'M12 11.5v2'];
  let asUnit = 'sso';
  const asData = () => {
    if (dash.assign) return dash.assign;
    const d = dash.data && dash.data('assign');
    return d && d.status === 'ok' && d.data && !Array.isArray(d.data) ? d.data : { sections: [], shared: [], rpst: [], units: [] };
  };
  // common short names -> words used in the order (for the search boxes)
  const AS_ALIAS = { ncd: 'ไม่ติดต่อ', เบาหวาน: 'ไม่ติดต่อ', ความดัน: 'ไม่ติดต่อ', dm: 'ไม่ติดต่อ', ht: 'ไม่ติดต่อ', ฟัน: 'ทันต', ทันตะ: 'ทันต',
    it: 'เทคโนโลยี', คอม: 'เทคโนโลยี', เงิน: 'การเงิน', แผนไทย: 'แพทย์แผนไทย', ฆ่าตัวตาย: 'สุขภาพจิต', วัคซีน: 'ภูมิคุ้มกัน',
    epi: 'ภูมิคุ้มกัน', แม่และเด็ก: 'อนามัยแม่และเด็ก', mch: 'อนามัยแม่และเด็ก', ltc: 'ผู้สูงอายุ' };
  const asTerms = (raw) => {
    const q = raw.trim().toLowerCase();
    if (!q) return [];
    const a = AS_ALIAS[q.replace(/[\s.]/g, '')];
    return a ? [q, a] : [q];
  };
  const shortName = (n) => n.replace(/^(นางสาว|นาย|นาง)/, '').trim().split(/\s+/)[0];
  // jobs that are not real work areas: "อื่น ๆ ที่ได้รับมอบหมาย", "ปฏิบัติหน้าที่ผู้ช่วย…"
  const isGenericDuty = (d) => /^งานอื่น|ได้รับมอบหมาย|^ปฏิบัติหน้าที่/.test(d);
  const jobKey = (d) => d.replace(/\s+/g, '').replace(/^งาน/, '');

  // every unit: {code, name, people:[{name, position, role, group, duties}]}
  function asUnits(a) {
    const sso = { code: 'sso', name: 'สสอ.ขุนยวม', people: a.sections.slice(1).flatMap((s) => s.people) };
    const rp = (a.units || []).map((u) => {
      const r = (a.rpst || []).find((x) => x.code === u.code) || {};
      return { code: u.code, name: u.name, people: (r.people || []).map((p) => ({ role: '', group: '', duties: [], position: '', ...p })) };
    });
    return [sso, ...rp];
  }

  function personCard(p, lead) {
    const c = el('div', { class: 'ky-person' + (lead ? ' ky-person-lead' : ''), 'data-search': [p.name, p.position, p.role, p.group, ...p.duties].join(' ').toLowerCase() });
    const hd = el('div', { class: 'ky-person-head' });
    hd.append(el('span', { class: 'ky-avatar', 'aria-hidden': 'true' }, shortName(p.name).charAt(0)));
    const who = el('div');
    who.append(el('b', {}, p.name), el('span', { class: 'ky-pos' }, p.position));
    hd.append(who);
    c.append(hd);
    if (p.role) c.append(el('div', { class: 'ky-role' }, p.role.replace(/^ทำหน้าที่/, '').trim()));
    if (p.duties.length) {
      const ol = el('ol', { class: 'ky-duties' });
      p.duties.forEach((d) => ol.append(el('li', {}, d)));
      if (p.duties.length > 6) {
        const det = el('details');
        det.append(el('summary', {}, `หน้าที่ความรับผิดชอบ ${p.duties.length} งาน`), ol);
        c.append(det);
      } else {
        c.append(el('div', { class: 'ky-duties-h' }, `หน้าที่ความรับผิดชอบ ${p.duties.length} งาน`), ol);
      }
    }
    return c;
  }

  function searchBox(placeholder, onInput) {
    const search = el('input', { type: 'search', class: 'ky-search', placeholder, 'aria-label': placeholder });
    const hint = el('div', { class: 'ky-note' }, '');
    search.addEventListener('input', () => onInput(search.value, hint));
    return { search, hint };
  }

  function buildAssign(view) {
    const a = asData();
    const out = [];
    if (!a.sections.length) {
      out.push(finEmpty('ยังไม่มีข้อมูลการแบ่งงาน', ['ยังไม่ได้นำเข้าคำสั่งแบ่งงาน']));
      return { nodes: out, draw: () => {} };
    }
    if (view === '__as_sso') asUnit = 'sso';
    if (view === '__as_rpst' && asUnit === 'sso') asUnit = (a.units[0] || {}).code || 'sso';
    const units = asUnits(a);
    const head = el('section', { class: 'ky-sec' });
    head.append(el('div', { class: 'ky-note' }, `ที่มา: คำสั่งอำเภอขุนยวม เรื่อง ${a.title}${a.effective ? ' · ' + a.effective : ''}`));
    out.push(head);
    return view === '__as_job' ? asJobView(a, units, out, head) : asUnitView(a, units, out, head);
  }

  function asUnitView(a, units, out, head) {
    if (!units.some((u) => u.code === asUnit)) asUnit = 'sso';
    const chips = el('div', { class: 'ky-chips', role: 'group', 'aria-label': 'หน่วยงาน' });
    units.forEach((u) => chips.append(el('button', { type: 'button', class: 'ky-chip', 'data-as-unit': u.code, 'aria-pressed': String(u.code === asUnit) },
      u.name.replace('รพ.สต.', '') + (u.code !== 'sso' && !u.people.length ? ' ·' : ''))));
    head.append(chips);
    const big = (x, y) => { const d = el('div', { class: 'big' }); d.append(x, el('small', {}, y)); return d; };

    if (asUnit !== 'sso') {
      const u = units.find((x) => x.code === asUnit);
      if (!u.people.length) {
        out.push(finEmpty(`ยังไม่มีข้อมูลการแบ่งงานของ ${u.name}`, ['ส่งไฟล์คำสั่งหรือรายชื่อผู้รับผิดชอบงานของ รพ.สต. นี้มา แล้วจะแสดงที่หน้านี้']));
        return { nodes: out, draw: () => {} };
      }
      const grid = el('div', { class: 'ky-org-grid' });
      u.people.forEach((p) => grid.append(personCard(p)));
      out.push(grid);
      return { nodes: out, draw: () => {} };
    }

    const people = a.sections.flatMap((s) => s.people);
    const groups = a.sections.flatMap((s) => s.groups || []);
    const tiles = el('div', { class: 'ky-tiles' });
    tiles.append(
      tile('ky-t1', ICONS.people, 'บุคลากร สสอ.', big(String(people.length), ' คน'), 'ตามคำสั่งแบ่งงาน'),
      tile('ky-t2', ICONS.org, 'ภารกิจ', big(String(a.sections.length - 1), ' ด้าน'), a.sections.slice(1).map((s) => s.title.replace(/^.*ภารกิจด้าน/, '')).join(' · ')),
      tile('ky-t3', ICONS.map, 'กลุ่มงาน', big(String(groups.length), ' กลุ่ม'), groups.map((g) => g.replace('กลุ่มงาน', '')).join(' · ')),
      tile('ky-t4', ICONS.check, 'งานในคำสั่ง', big(String(people.reduce((s, p) => s + p.duties.length, 0) + a.shared.length), ' งาน'), `รวมงานร่วมกัน ${a.shared.length} งาน`),
    );
    head.append(tiles);
    const { search, hint } = searchBox('ค้นหางานหรือชื่อ เช่น NCD, การเงิน, วัคซีน', (raw, hintEl) => {
      const terms = asTerms(raw);
      const match = (t) => terms.some((q) => t.includes(q));
      let n = 0;
      cardsEl.querySelectorAll('.ky-person').forEach((c) => {
        const hit = !terms.length || match(c.dataset.search);
        c.classList.toggle('ky-dim', !hit);
        if (hit && terms.length) n++;
        c.querySelectorAll('.ky-duties li').forEach((li) => li.classList.toggle('ky-hit', !!terms.length && match(li.textContent.toLowerCase())));
        const det = c.querySelector('details');
        if (det && terms.length && hit) det.open = true;
      });
      hintEl.textContent = terms.length ? (n ? `พบ ${n} คนที่เกี่ยวข้องกับ "${raw.trim()}"` : `ไม่พบ "${raw.trim()}" ในคำสั่งแบ่งงาน`) : '';
    });
    head.append(search, hint);

    const org = el('section', { class: 'ky-sec' });
    const topWrap = el('div', { class: 'ky-org-top' });
    a.sections[0].people.forEach((p) => topWrap.append(personCard(p, true)));
    org.append(topWrap);
    const cols = el('div', { class: 'ky-org-grid' });
    a.sections.slice(1).forEach((s) => {
      const col = el('div', { class: 'ky-card ky-org-col' });
      col.append(el('h3', {}, s.title));
      s.people.filter((p) => !p.group).forEach((p) => col.append(personCard(p, true)));
      (s.groups || []).forEach((g) => {
        col.append(el('div', { class: 'ky-org-group' }, g));
        s.people.filter((p) => p.group === g).forEach((p) => col.append(personCard(p)));
      });
      cols.append(col);
    });
    org.append(cols);
    const sh = el('div', { class: 'ky-card' });
    sh.append(el('h3', {}, 'งานที่รับผิดชอบร่วมกันของบุคลากรทุกคน'));
    const ol = el('ol', { class: 'ky-duties' });
    a.shared.forEach((d) => ol.append(el('li', {}, d)));
    sh.append(ol);
    org.append(sh);
    out.push(org);
    return { nodes: out, draw: () => {} };
  }

  const AS_OTHER = 'งานอื่น ๆ (เฉพาะ รพ.สต.)';
  // a person's กลุ่มงาน: their own group, or the group they head (ผู้ช่วย สสอ. have group null but head one)
  const personGroup = (p, groups) => p.group || groups.find((g) => (p.role || '').includes('หัวหน้า' + g)) || null;
  const headsGroup = (p, g) => (p.role || '').includes('หัวหน้า' + g);

  function asJobView(a, units, out, head) {
    // job -> unit code -> [person names]; same people as the unit view. Jobs keep the order of the district order.
    const groups = a.sections.flatMap((s) => s.groups || []);
    const jobs = new Map();
    let seq = 0;
    units.forEach((u) => u.people.forEach((p) => p.duties.forEach((d) => {
      if (isGenericDuty(d)) return;
      const k = jobKey(d);
      const j = jobs.get(k) || { label: d, units: {}, score: {}, ord: {} };
      if (d.length < j.label.length) j.label = d;
      (j.units[u.code] = j.units[u.code] || []).includes(p.name) || j.units[u.code].push(p.name);
      if (u.code === 'sso') {
        // กลุ่มงาน of a job = group of its สสอ. holders (1 per holder, +0.5 for the group head; tie -> order of the groups)
        const g = personGroup(p, groups);
        if (g) { j.score[g] = (j.score[g] || 0) + 1 + (headsGroup(p, g) ? 0.5 : 0); if (!(g in j.ord)) j.ord[g] = seq++; }
      }
      jobs.set(k, j);
    })));
    const list = [...jobs.values()];
    list.forEach((j) => {
      let best = null;
      groups.forEach((g) => { if ((j.score[g] || 0) > (best ? j.score[best] : 0)) best = g; });
      j.group = best || AS_OTHER;
    });
    const blocks = [...groups, AS_OTHER].map((g) => ({ g, jobs: list.filter((j) => j.group === g).sort((x, y) => (x.ord[g] ?? 1e9) - (y.ord[g] ?? 1e9)) })).filter((b) => b.jobs.length);
    const withData = units.filter((u) => u.people.length);
    const missing = units.filter((u) => !u.people.length);
    const note = el('div', { class: 'ky-note' }, `${list.length} งาน ${blocks.length} กลุ่มงาน · แสดงผู้รับผิดชอบของ ${withData.map((u) => u.name.replace('รพ.สต.', '')).join(', ')}`);
    if (missing.length) note.append(el('span', { class: 'ky-old' }, `ยังไม่มีข้อมูล: ${missing.map((u) => u.name.replace('รพ.สต.', '')).join(', ')}`));
    head.append(note);
    const { search, hint } = searchBox('ค้นหางาน เช่น วัคซีน, NCD, การเงิน, สุขภาพจิต', (raw, hintEl) => {
      const terms = asTerms(raw);
      let n = 0;
      tbody.querySelectorAll('tr[data-search]').forEach((tr) => {
        const hit = !terms.length || terms.some((q) => tr.dataset.search.includes(q));
        tr.hidden = !hit;
        if (hit && terms.length) n++;
      });
      // hide a กลุ่มงาน header when none of its jobs match
      tbody.querySelectorAll('tr.ky-job-grp').forEach((gr) => {
        gr.hidden = !tbody.querySelector(`tr[data-search][data-grp="${gr.dataset.grp}"]:not([hidden])`);
      });
      hintEl.textContent = terms.length ? (n ? `พบ ${n} งาน` : `ไม่พบงาน "${raw.trim()}"`) : '';
    });
    head.append(search, hint);

    const card = el('div', { class: 'ky-card' });
    card.append(el('h3', {}, 'ผู้รับผิดชอบแยกตามกลุ่มงาน'), el('div', { class: 'ky-note' },
      'จัดกลุ่มตามกลุ่มงานของผู้รับผิดชอบใน สสอ. · ชี้ที่ชื่อเพื่อดูชื่อ–สกุลเต็ม · งาน "อื่น ๆ ที่ได้รับมอบหมาย" ไม่ได้แสดง'));
    const wrap = el('div', { class: 'ky-tablewrap' });
    const tb = el('table', { class: 'ky-table ky-job' });
    const hr = el('tr');
    hr.append(el('th', {}, 'งาน'));
    withData.forEach((u) => hr.append(el('th', {}, u.name.replace('รพ.สต.', ''))));
    const thead = el('thead'); thead.append(hr);
    const tbody = el('tbody');
    blocks.forEach((b, bi) => b.jobs.forEach((j, ji) => {
      if (!ji) {
        const gr = el('tr', { class: 'ky-job-grp', 'data-grp': String(bi) });
        gr.append(el('th', { colspan: String(withData.length + 1), scope: 'colgroup' }, `${b.g} (${b.jobs.length} งาน)`));
        tbody.append(gr);
      }
      const tr = el('tr', { 'data-grp': String(bi), 'data-search': [b.g, j.label, ...Object.values(j.units).flat()].join(' ').toLowerCase() });
      const name = el('td', { class: 'ky-job-name' }, j.label);
      tr.append(name);
      withData.forEach((u) => {
        const names = j.units[u.code] || [];
        const td = el('td', names.length ? {} : { class: 'ky-muted-cell' });
        if (!names.length) td.textContent = '·';
        names.forEach((nm, i) => { if (i) td.append(', '); td.append(el('span', { class: 'ky-job-person', title: nm }, shortName(nm))); });
        tr.append(td);
      });
      tbody.append(tr);
    }));
    tb.append(thead, tbody);
    wrap.append(tb);
    card.append(wrap);
    const shared = el('div', { class: 'ky-note' }, `งานที่ทุกคนรับผิดชอบร่วมกัน: ${a.shared.join(' · ')}`);
    card.append(shared);
    out.push(card);
    return { nodes: out, draw: () => {} };
  }

  cardsEl.addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-as-unit]');
    if (b) { asUnit = b.dataset.asUnit; dash.setParams({ au: asUnit }); }
  });

  function buildOverview(groups) {
    const out = [];
    const cards = [];
    groups.forEach((g) => {
      const sec = el('section', { class: 'ky-sec', id: `ov-${groups.indexOf(g)}` });
      sec.append(el('h2', {}, g));
      const grid = el('div', { class: 'ky-ov-grid' });
      kpisOf(g).forEach((k) => {
        const rows = allRows.filter((r) => r.kpi === k.kpi);
        const subs = [...new Map(rows.map((r) => [r.sub, r.sub_order ?? 1])).entries()].sort((a, b) => a[1] - b[1]).map(([s]) => s);
        subs.forEach((s) => {
          const rs = rows.filter((r) => r.sub === s);
          const prov = rs.find((r) => r.level === 'จังหวัด');
          const dist = rs.find((r) => r.level === 'อำเภอ');
          if (!prov || !dist) return;
          const multi = seriesOf(dist);
          const tag = multi.length > 1 ? ` (${multi[0].label})` : '';
          const hasTarget = prov.target != null && prov.target !== '';
          const target = Number(prov.target);
          const state = !hasTarget ? 'none' : dist.pct >= target ? 'ok' : 'bad';
          cards.push(state);
          const where = `kpi=${encodeURIComponent(prov.kpi)}&sub=${encodeURIComponent(prov.sub)}&code=5802`;
          const c = el('button', { type: 'button', class: 'ky-ov', 'data-go-kpi': k.kpi, 'data-go-group': g });
          c.style.setProperty('--ky-ov-c', state === 'ok' ? 'var(--ky-t2)' : state === 'bad' ? 'var(--color-bad)' : tint(45));
          c.append(el('span', { class: 'nm' }, prov.sub_name + tag));
          const vals = el('span', { class: 'vals' });
          const v = el('span', { class: 'v' });
          v.append(el('span', { 'data-source': 'hdc', 'data-field': 'pct', 'data-where': where }, f2(dist.pct)), el('small', {}, '%'));
          vals.append(v, el('span', { class: 'pv' }, `จังหวัด ${f2(prov.pct)}%`));
          c.append(vals);
          const bar = el('span', { class: 'bar' });
          const fill = el('i');
          const hi = !hasTarget && Math.max(dist.pct, prov.pct) < 20 ? d3.nice(0, Math.max(dist.pct, prov.pct, 1) * 1.25, 4)[1] : 100;
          fill.style.width = Math.max(0, Math.min(100, (dist.pct / hi) * 100)) + '%';
          fill.style.background = state === 'bad' ? PAL.bad : PAL.pass;
          bar.append(fill);
          if (hasTarget) { const m = el('b'); m.style.left = `calc(${Math.min(100, (target / hi) * 100)}% - 1px)`; bar.append(m); }
          c.append(bar);
          c.append(el('span', { class: `ky-pill ${state}` }, state === 'ok' ? `ผ่านเกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%` : state === 'bad' ? `ต่ำกว่าเกณฑ์ ${target < 100 ? '≥ ' : ''}${target}%` : 'ไม่มีเกณฑ์'));
          grid.append(c);
        });
      });
      sec.append(grid);
      out.push(sec);
    });
    const n = (st) => cards.filter((x) => x === st).length;
    const withT = n('ok') + n('bad');
    const tiles = el('div', { class: 'ky-tiles' });
    const big = (a, b) => { const d = el('div', { class: 'big' }); d.append(a, el('small', {}, b)); return d; };
    tiles.append(
      tile('ky-t1', ICONS.check, 'ตัวชี้วัดที่ผ่านเกณฑ์', big(`${n('ok')} / ${withT}`, ' ตัว'), `จากตัวชี้วัดที่มีเกณฑ์ ${withT} ตัว`),
      tile('ky-t2', ICONS.map, 'ร้อยละที่ผ่านเกณฑ์', big(withT ? f2((n('ok') * 100) / withT) : '—', '%'), 'ของตัวชี้วัดที่มีเกณฑ์'),
      tile('ky-t3', ICONS.pin, 'ต่ำกว่าเกณฑ์', big(String(n('bad')), ' ตัว'), 'กดการ์ดสีแดงด้านล่างเพื่อดูรายละเอียด'),
      tile('ky-t4', ICONS.people, 'ไม่มีเกณฑ์ (ติดตามผล)', big(String(n('none')), ' ตัว'), 'แสดงผลงานเพื่อติดตาม'),
    );
    const head = el('section', { class: 'ky-sec' });
    head.append(el('div', { class: 'ky-note' }, 'ผลงานอำเภอขุนยวมทุกตัวชี้วัด เทียบกับเกณฑ์และภาพรวมจังหวัด · กดการ์ดเพื่อดูรายหน่วยบริการ'), tiles);
    return [head, ...out];
  }

  cardsEl.addEventListener('click', (ev) => {
    const c = ev.target.closest('button[data-go-kpi]');
    if (c) { dash.setParams({ group: c.dataset.goGroup, kpi: c.dataset.goKpi }); window.scrollTo({ top: 0 }); }
  });

  dash.onData(() => {
    const h = dash.data('hdc');
    allRows = h.status === 'ok' ? h.data.map((r) => ({ ...r, code: String(r.code), sub: r.sub ?? 'main' })) : [];
    const groups = [...new Set(allRows.map((r) => r.group)), FIN_GROUP, PA_GROUP, AS_GROUP];
    if (dash.params().fm) finMonth = dash.params().fm;
    if (dash.params().pu) paUnit = dash.params().pu;
    if (dash.params().au) asUnit = dash.params().au;
    const p = dash.params();
    const group = groups.includes(p.group) ? p.group : groups[0];
    const kpis = kpisOf(group);
    const kpi = !p.kpi || p.kpi === OVERVIEW ? OVERVIEW : kpis.some((k) => k.kpi === p.kpi) ? p.kpi : kpis[0]?.kpi;
    document.getElementById('ky-app').style.setProperty('--ky-accent', dash.colors[0]);

    if (!expanded) expanded = new Set(group && kpi !== OVERVIEW ? [group] : []);
    if (group && kpi !== OVERVIEW && menuState.kpi !== kpi) expanded.add(group);
    menuState = { groups, group, kpi };
    renderMenu();

    const latest = allRows.reduce((m, r) => (r.processed > m ? r.processed : m), '');
    document.getElementById('ky-latest').textContent = latest ? thDate(latest) : '—';
    document.getElementById('ky-pub').textContent = dash.published ? `· เผยแพร่ล่าสุด ${thDateTime(dash.published)}` : '';
    if (kpi === OVERVIEW) {
      document.getElementById('ky-title').textContent = 'ภาพรวมทั้งอำเภอ';
      document.getElementById('ky-crumb').textContent = 'หน้าหลัก / ภาพรวมทั้งอำเภอ';
      cardsEl.replaceChildren(...buildOverview(groups.filter((g) => g !== FIN_GROUP && g !== PA_GROUP && g !== AS_GROUP)));
      return;
    }
    if (kpi.startsWith('__as')) {
      const k = AS_KPIS.find((x) => x.kpi === kpi) || AS_KPIS[0];
      document.getElementById('ky-title').textContent = `${AS_GROUP} · ${k.kpi_name}`;
      document.getElementById('ky-crumb').textContent = `หน้าหลัก / ${AS_GROUP} / ${k.kpi_name}`;
      const b = buildAssign(kpi);
      cardsEl.replaceChildren(...b.nodes);
      b.draw();
      return;
    }
    if (kpi.startsWith('__pa')) {
      const k = PA_KPIS.find((x) => x.kpi === kpi);
      document.getElementById('ky-title').textContent = `${PA_GROUP} · ${k.kpi_name}`;
      document.getElementById('ky-crumb').textContent = `หน้าหลัก / ${PA_GROUP} / ${k.kpi_name}`;
      const b = buildPA(kpi);
      cardsEl.replaceChildren(...b.nodes);
      b.draw();
      return;
    }
    if (kpi.startsWith('__fin')) {
      const k = FIN_KPIS.find((x) => x.kpi === kpi);
      document.getElementById('ky-title').textContent = `${FIN_GROUP} · ${k.kpi_name}`;
      document.getElementById('ky-crumb').textContent = `หน้าหลัก / ${FIN_GROUP} / ${k.kpi_name}`;
      const f = buildFinance(kpi);
      cardsEl.replaceChildren(...f.nodes);
      f.draw();
      return;
    }
    const rows = allRows.filter((r) => r.kpi === kpi);
    const first = rows[0];
    document.getElementById('ky-title').textContent = first ? first.kpi_name : '—';
    document.getElementById('ky-crumb').textContent = `หน้าหลัก / ${group ?? ''}`;

    const subs = [...new Map(rows.map((r) => [r.sub, r.sub_order ?? 1])).entries()].sort((a, b) => a[1] - b[1]).map(([s]) => s);
    const built = subs.map((s) => { const rs = rows.filter((r) => r.sub === s); return { rows: rs, ...buildSection(rs) }; });
    cardsEl.replaceChildren(...built.map((b) => b.sec));
    built.forEach((b) => { drawChart(b.box, b.rows); drawGauge(b.gbox, b.rows); });
  });
</script>
